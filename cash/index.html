<!doctype html>
<html lang="ru" data-theme="dark" style="background:#0b1017;visibility:hidden">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Horeca Control — Кассы</title>
<link rel="stylesheet" href="/app-shell.css">
<style id="cash-modern-style">
.cash-page{width:100%;max-width:1500px;margin:0 auto}.cash-modern{width:100%;display:grid;gap:18px}.cash-network-card{padding:24px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(135deg,#121b25,#0f151e);box-shadow:0 12px 35px rgba(0,0,0,.16)}
.cash-network-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.cash-network-title .eyebrow{color:#42d392}.cash-network-title h1{margin:6px 0 5px;font-size:25px}.cash-network-title p{margin:0;color:#8290a0;font-size:12px;line-height:1.5}.cash-network-badge{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid rgba(66,211,146,.2);border-radius:10px;background:rgba(66,211,146,.07);color:#72dfac;font-size:11px;white-space:nowrap}
.cash-network-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}.cash-network-kpi{padding:16px 17px;border:1px solid rgba(255,255,255,.06);border-radius:13px;background:rgba(255,255,255,.025)}.cash-network-kpi span,.cash-network-kpi small{display:block;color:#778596;font-size:10px}.cash-network-kpi strong{display:block;margin:6px 0 3px;font-size:23px;letter-spacing:-.02em}.cash-network-kpi.expected{border-color:rgba(66,211,146,.16);background:rgba(66,211,146,.045)}.cash-network-kpi.expected strong{color:#42d392}
.cash-modern-head{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;padding:0 2px}.cash-modern-head h2{margin:3px 0 0;font-size:19px}.cash-modern-head p{margin:4px 0 0;color:#778596;font-size:11px}.cash-selection-note,.cash-last-updated{color:#718092;font-size:10px}.cash-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.cash-modern-loading{grid-column:1/-1;padding:30px;text-align:center;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:#101720;color:#718092;font-size:11px}
.cash-modern-card{overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:#101720;transition:border-color .18s,box-shadow .18s}.cash-modern-card:hover{border-color:rgba(66,211,146,.18);box-shadow:0 12px 30px rgba(0,0,0,.12)}.cash-modern-card-head{padding:18px 19px 15px;border-bottom:1px solid rgba(255,255,255,.06)}.cash-modern-card-title{display:flex;justify-content:space-between;gap:15px}.cash-modern-card-title h3{margin:4px 0 3px;font-size:17px}.cash-modern-card-title p{margin:0;color:#7c8998;font-size:11px}.cash-cash-status{padding:6px 9px;border-radius:8px;background:rgba(66,211,146,.08);color:#63d9a0;font-size:10px;white-space:nowrap;height:max-content}.cash-card-statline{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.cash-card-statline span{padding:5px 8px;border-radius:7px;background:#151f2a;color:#91a0af;font-size:10px}.cash-card-statline b{color:#e8eef5}.cash-card-statline .accent{color:#42d392}
.cash-order-tools{display:flex;gap:8px;align-items:center;padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.05)}.cash-order-search{flex:1;min-width:120px;padding:9px 11px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:#0d141c;color:#eaf0f5;outline:none;font-size:11px}.cash-order-search:focus{border-color:rgba(66,211,146,.4)}.cash-order-filters{display:flex;gap:5px;flex-wrap:wrap}.cash-order-filters button{border:1px solid rgba(255,255,255,.07);border-radius:7px;background:#151f2a;color:#8e9baa;padding:7px 9px;font-size:10px;cursor:pointer}.cash-order-filters button.active{background:rgba(66,211,146,.13);border-color:rgba(66,211,146,.3);color:#63d9a0}
.cash-modern-orders{max-height:430px;overflow:auto}.cash-modern-orders table{width:100%;border-collapse:collapse;min-width:720px}.cash-modern-orders th{position:sticky;top:0;z-index:1;background:#111a23;color:#667687;text-align:left;font-size:9px;font-weight:600;padding:10px 12px}.cash-modern-orders td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.045);font-size:10px;color:#cbd4de}.cash-modern-orders tr.order-row{cursor:pointer;transition:background .15s}.cash-modern-orders tr.order-row:hover{background:rgba(66,211,146,.055)}.cash-modern-orders .order-num{font-weight:700;color:#eef3f7}.cash-modern-orders .order-amount{font-weight:700;color:#eef3f7;text-align:right}.cash-modern-empty{padding:28px 15px;text-align:center;color:#718092;font-size:11px}.cash-modern-footer{display:flex;justify-content:space-between;gap:10px;padding:10px 15px;color:#687687;font-size:9px;border-top:1px solid rgba(255,255,255,.05)}.cash-card-error{color:#e58b8b}
#cash-modern-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}#cash-modern-modal.open{display:flex}.cm-backdrop{position:absolute;inset:0;background:rgba(3,7,11,.72);backdrop-filter:blur(5px)}.cm-dialog{position:relative;width:min(980px,96vw);max-height:90vh;overflow:auto;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:#111923;box-shadow:0 25px 80px rgba(0,0,0,.5)}.cm-head{display:flex;justify-content:space-between;gap:15px;padding:20px 22px;border-bottom:1px solid rgba(255,255,255,.07)}.cm-head h2{margin:4px 0;font-size:20px}.cm-head p{margin:0;color:#7d8998;font-size:11px}.cm-close{width:34px;height:34px;border:0;border-radius:9px;background:#1a2531;color:#d9e1e9;font-size:20px;cursor:pointer}.cm-body{padding:18px 22px}.cm-details{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cm-detail{padding:11px 12px;border-radius:10px;background:#0d151e}.cm-detail span{display:block;color:#718092;font-size:9px}.cm-detail strong{display:block;margin-top:4px;color:#e7edf3;font-size:11px}.cm-section{margin-top:18px}.cm-section-title{font-size:12px;font-weight:700;color:#eef3f7;margin-bottom:8px}.cm-table{width:100%;border-collapse:collapse}.cm-table th,.cm-table td{padding:9px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;font-size:10px}.cm-table th{color:#718092;font-size:9px}.cm-history{display:grid;gap:7px}.cm-event{padding:10px 12px;border-radius:9px;background:#0d151e}.cm-event strong{display:block;color:#e3eaf1;font-size:10px}.cm-event span{display:block;margin-top:3px;color:#738193;font-size:9px}.cm-empty{padding:16px;border-radius:9px;background:#0d151e;color:#718092;font-size:10px}
@media(max-width:1100px){.cash-cards{grid-template-columns:1fr}}@media(max-width:950px){.cash-network-kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cash-network-card{padding:17px}.cash-network-top{flex-direction:column}.cash-network-kpis{grid-template-columns:1fr}.cash-modern-head{align-items:flex-start;flex-direction:column}.cash-order-tools{flex-direction:column;align-items:stretch}.cm-details{grid-template-columns:1fr 1fr}.cm-body{padding:15px}.cm-head{padding:16px}}
</style>
