<!DOCTYPE html><html lang="ru" data-theme="dark" style="background:#0b1017;visibility:hidden"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Horeca Control — Счета</title><link rel="stylesheet" href="app-shell.css"><style>
.accounts-page{padding:28px 30px 50px;max-width:1650px;margin:auto}.acc-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.acc-kicker{font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#42d392;margin-bottom:7px}.acc-title{margin:0;font-size:28px;line-height:1.15;color:#f4f7fa}.acc-sub{margin:7px 0 0;color:#8994a3;font-size:12px}.acc-panel{background:#111923;border:1px solid #222c38;border-radius:14px;padding:17px;margin-bottom:14px}.acc-tools{display:grid;grid-template-columns:minmax(240px,1fr) 230px auto;gap:10px;align-items:end}.acc-field{display:flex;flex-direction:column;gap:6px}.acc-field label{font-size:10px;color:#8994a3;font-weight:750}.acc-field input,.acc-field select{height:40px;width:100%;box-sizing:border-box;padding:9px 11px;background:#0e151d;color:#f4f7fa;border:1px solid #293442;border-radius:9px}.acc-btn{height:40px;padding:0 17px;border:0;border-radius:9px;background:#42d392;color:#06110b;font-weight:850;cursor:pointer}.acc-btn:disabled{opacity:.55;cursor:wait}.acc-status{font-size:10px;color:#8994a3;min-height:16px;margin-top:10px}.acc-status.ok{color:#42d392}.acc-status.error{color:#ff6678}.acc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.acc-stat{background:#111923;border:1px solid #222c38;border-radius:12px;padding:14px}.acc-stat span{display:block;color:#8994a3;font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;margin-bottom:7px}.acc-stat strong{font-size:20px;color:#f4f7fa}.acc-table-wrap{overflow:auto;border:1px solid #222c38;border-radius:12px;background:#0f171f}.acc-table{width:100%;min-width:900px;border-collapse:collapse;font-size:11px}.acc-table th{padding:10px;text-align:left;background:#111923;color:#6f7c8b;font-size:8px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}.acc-table td{padding:11px 10px;border-top:1px solid #1d2732;color:#dce4eb;vertical-align:top}.acc-table tbody tr:hover{background:#121d26}.acc-table td b{color:#f4f7fa}.acc-type{display:block;color:#dce4eb}.acc-table td small{display:block;color:#647080;font-size:8px;margin-top:3px}.acc-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:#8994a3!important;font-size:9px}.acc-system,.acc-active,.acc-deleted{display:inline-flex;margin-left:7px;padding:3px 6px;border-radius:999px;font-size:7px;font-weight:800}.acc-system{background:#202a36;color:#9eabb8}.acc-active{background:#15251f;color:#42d392}.acc-deleted{background:#321d23;color:#ff6678}.acc-empty{text-align:center;padding:35px!important;color:#6f7c8b}.acc-check{display:flex;align-items:center;gap:7px;height:40px;color:#8994a3;font-size:10px}.acc-check input{width:16px;height:16px}@media(max-width:900px){.acc-tools{grid-template-columns:1fr 1fr}.acc-tools .acc-field:first-child{grid-column:1/-1}.acc-tools .acc-btn{grid-column:1/-1}.acc-stats{grid-template-columns:1fr 1fr}}@media(max-width:760px){.accounts-page{padding:18px 14px 34px}.acc-title{font-size:23px}.acc-head{align-items:flex-start;flex-direction:column}.acc-tools{grid-template-columns:1fr}.acc-tools .acc-field:first-child,.acc-tools .acc-btn{grid-column:auto}.acc-stats{grid-template-columns:1fr 1fr}}@media(max-width:420px){.acc-stats{grid-template-columns:1fr}.accounts-page{padding-left:12px;padding-right:12px}}
</style></head><body data-protected="true" style="background:#0b1017"><div class="app-shell"><aside class="sidebar"></aside><main class="main"><header class="topbar"><div><button class="icon-btn mobile-menu" data-mobile-menu>☰</button><span class="topbar-title">Счета</span><div class="topbar-sub">Финансовый справочник SH Server</div></div><div class="top-actions"><span class="user-chip"><span class="user-avatar" data-auth-avatar>U</span><span data-auth-name>Пользователь</span></span><button class="icon-btn" data-auth-logout>Выйти</button></div></header><section class="accounts-page"><div class="acc-head"><div><div class="acc-kicker">SH Server API</div><h1 class="acc-title">Счета</h1><p class="acc-sub">Справочник финансовых счетов ресторана, полученный напрямую из SH Server.</p></div></div><div class="acc-panel"><div class="acc-tools"><div class="acc-field"><label>Поиск</label><input id="acc-search" type="search" placeholder="Название, код или ID"></div><div class="acc-field"><label>Тип счёта</label><select id="acc-type"><option value="">Все типы счетов</option></select></div><button class="acc-btn" id="acc-load">Загрузить счета</button></div><div class="acc-status" id="acc-status">Готово к загрузке.</div></div><div class="acc-stats"><div class="acc-stat"><span>Всего счетов</span><strong id="acc-total">0</strong></div><div class="acc-stat"><span>Типов</span><strong id="acc-types">0</strong></div><div class="acc-stat"><span>Системные</span><strong id="acc-system">0</strong></div><div class="acc-stat"><span>Пользовательские</span><strong id="acc-custom">0</strong></div></div><div class="acc-panel"><div class="panel-head"><div><div class="section-kicker">Результат</div><div class="panel-title">Список счетов <span id="acc-count" style="color:#6f7c8b;font-size:9px;font-weight:500"></span></div></div></div><div class="acc-table-wrap"><table class="acc-table"><thead><tr><th>Название</th><th>Код</th><th>Тип</th><th>ID</th><th>Статус</th><th>Ручные проводки</th></tr></thead><
