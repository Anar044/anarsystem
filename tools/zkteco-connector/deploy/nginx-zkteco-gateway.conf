# Replace zkteco.smarthoreca.az with the real public hostname.
# HTTP is intentionally kept for /iclock/* because some ZKTeco firmware
# has limited HTTPS/TLS support. Admin routes are NOT exposed over HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name zkteco.smarthoreca.az;

    client_max_body_size 2m;

    location /iclock/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8088/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zkteco.smarthoreca.az;

    # Certbot can populate/maintain these paths.
    ssl_certificate /etc/letsencrypt/live/zkteco.smarthoreca.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zkteco.smarthoreca.az/privkey.pem;

    client_max_body_size 2m;

    location /iclock/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8088/health;
        proxy_set_header Host $host;
    }

    # Admin API is HTTPS-only and also protected by X-SH-Gateway-Key/Bearer.
    location /admin/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
