<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SH_Reports — Восстановление</title>
<link rel="stylesheet" href="auth.css">
</head>
<body data-auth-page="forgot">
<div class="auth-page">
 <div class="auth-theme"><button type="button" onclick="toggleSHTheme()" data-theme-label>🌙 Тёмная тема</button></div>
 <div class="auth-wrap">
  <div class="auth-brand">SH_<span>Reports</span></div>
  <div class="auth-card">
   <h1>Восстановление пароля</h1>
   <p class="lead">Введите email. Если аккаунт существует, мы отправим ссылку для создания нового пароля.</p>
   <div id="auth-message" class="auth-message" hidden></div>
   <form id="forgot-form" novalidate>
    <div class="auth-field"><label for="forgot-email">Email</label><input id="forgot-email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
    <button class="auth-submit" type="submit">Отправить письмо</button>
   </form>
   <div class="auth-links"><a href="login.html">← Вернуться ко входу</a><a href="register.html">Регистрация</a></div>
  </div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="app-shell.js"></script>
<script src="auth.js"></script>
</body>
</html>
