services:
  local-document-ai:
    build:
      context: .
    container_name: smarthoreca-local-document-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    environment:
      OCR_LANG: ${OCR_LANG:-az}
      OCR_VERSION: ${OCR_VERSION:-PP-OCRv5}
      LOCAL_AI_TOKEN: ${LOCAL_AI_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - paddle-models:/root/.paddlex
    shm_size: "2gb"

volumes:
  paddle-models:
