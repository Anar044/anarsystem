services:
  local-document-ai:
    build:
      context: .
    container_name: smarthoreca-local-document-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8789:8789"
    environment:
      OCR_LANG: ${OCR_LANG:-az}
      OCR_VERSION: ${OCR_VERSION:-PP-OCRv5}
      LOCAL_AI_TOKEN: ${LOCAL_AI_TOKEN:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      SECONDARY_OCR: ${SECONDARY_OCR:-easyocr}
      SECONDARY_OCR_LANGS: ${SECONDARY_OCR_LANGS:-az,en}
      OCR_JOB_WORKERS: ${OCR_JOB_WORKERS:-1}
      OCR_JOB_TTL_SECONDS: ${OCR_JOB_TTL_SECONDS:-7200}
    volumes:
      - paddle-models:/root/.paddlex
      - easyocr-models:/root/.EasyOCR
    shm_size: "2gb"

volumes:
  paddle-models:
  easyocr-models:
