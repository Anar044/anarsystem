<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SH_Reports — Новый пароль</title>
<link rel="stylesheet" href="auth.css">
</head>
<body data-auth-page="reset">
<div class="auth-page">
 <div class="auth-theme"><button type="button" onclick="toggleSHTheme()" data-theme-label>🌙 Тёмная тема</button></div>
 <div class="auth-wrap">
  <div class="auth-brand">SH_<span>Reports</span></div>
  <div class="auth-card">
   <h1>Новый пароль</h1>
   <p class="lead">Введите новый пароль для аккаунта.</p>
   <div id="auth-message" class="auth-message" hidden></div>
   <form id="reset-form" novalidate>
    <div class="auth-field"><label for="reset-password">Новый пароль</label><input id="reset-password" type="password" autocomplete="new-password" placeholder="Минимум 8 символов" required></div>
    <div class="auth-field"><label for="reset-password2">Повторите пароль</label><input id="reset-password2" type="password" autocomplete="new-password" placeholder="Повторите пароль" required></div>
    <button class="auth-submit" type="submit">Сохранить пароль</button>
   </form>
   <div class="auth-links"><a href="login.html">Вернуться ко входу</a></div>
  </div>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="app-shell.js"></script>
<script src="auth.js"></script>
</body>
</html>
