<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Horeca — постоянная навигация (пилот)</title>
  <script>document.documentElement.dataset.theme='dark';</script>
  <link rel="stylesheet" href="/app-shell.css?v=20261012-fast-nav1">
  <style id="sh-workspace-shell-style">
    body.sh-workspace-page{overflow:hidden;background:#0b1017!important}
    body.sh-workspace-page:not(.sh-workspace-ready) .sidebar{visibility:hidden!important}
    body.sh-workspace-page .sh-workspace-main{display:flex!important;flex-direction:column!important;height:100dvh!important;min-height:0!important;overflow:hidden!important}
    body.sh-workspace-page .sh-workspace-topbar{display:none!important}
    .sh-workspace-head-status{font-size:11px;color:#9aabb9}
    .sh-workspace-frame-host{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;background:#0b1017}
    /* Small nonblocking progress line: never replace working page with a splash. */
    .sh-workspace-frame-host.sh-is-loading::after{content:"";position:absolute;left:0;top:0;width:26%;height:2px;background:#42d392;z-index:5;pointer-events:none;animation:sh-shell-progress 1.15s ease-in-out infinite alternate}
    @keyframes sh-shell-progress{from{transform:translateX(0)}to{transform:translateX(270%)}}
    .sh-workspace-frame{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#0b1017}
    .sh-workspace-frame.sh-pending{visibility:hidden;pointer-events:none}
    /* Visible only for explicit ?navDebug=1 sessions; no normal UI changes. */
    .sh-nav-performance{position:absolute;top:7px;right:12px;z-index:7;max-width:calc(100% - 24px);padding:7px 10px;border-radius:8px;border:1px solid #2b5446;background:#102920;color:#b6edd1;font:11px/1.3 ui-monospace,Consolas,monospace;pointer-events:none;white-space:normal}
    .sh-nav-performance[hidden]{display:none!important}
    .sh-workspace-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#a1b1bf;font-size:14px}
    .sh-workspace-empty[hidden]{display:none!important}
    .sh-workspace-topbar .topbar-title{font-size:13px!important}\n    .sh-workspace-pilot-tag{font-size:11px;color:#63e0ac;border:1px solid #26543e;border-radius:8px;padding:6px 9px}
    @media(max-width:820px){body.sh-workspace-page .sh-workspace-topbar{padding:0 12px!important}.sh-workspace-pilot-tag{display:none}}
    /* Desktop-only compact sidebar: scoped to the opt-in workspace. */
    @media (min-width:761px){
      /* Option 04 — slim neon handle fixed outside the scrollable rail. */
      body.sh-workspace-page > .sh-sidebar-collapse-btn{
        display:flex!important;align-items:center!important;justify-content:center!important;
        position:fixed!important;
        top:clamp(125px,38vh,440px)!important;
        left:calc(var(--sidebar-w) - 2px)!important;
        z-index:220!important;
        box-sizing:border-box!important;
        width:30px!important;min-width:30px!important;
        height:70px!important;min-height:70px!important;
        margin:0!important;padding:0!important;
        border:0!important;border-radius:0!important;
        background:transparent!important;
        outline:none!important;
        color:#45f0d5!important;cursor:pointer!important;
        box-shadow:none!important;
        filter:drop-shadow(0 0 7px rgba(8,211,154,.24))!important;
        transition:left .2s ease,filter .2s ease!important;
        -webkit-tap-highlight-color:transparent;
      }
      body.sh-workspace-page > .sh-sidebar-collapse-btn:hover{
        filter:drop-shadow(0 0 10px rgba(27,240,181,.52))!important;
      }
      body.sh-workspace-page > .sh-sidebar-collapse-btn:focus-visible{
        outline:2px solid #6afbd2!important;outline-offset:3px!important;
        border-radius:8px!important;
      }
      body.sh-workspace-page .sh-sidebar-edge-svg{
        display:block!important;
        flex:none!important;width:30px!important;height:70px!important;
        overflow:visible!important;
      }
      body.sh-workspace-page .sh-sidebar-edge-shape{
        fill:#0d2330!important;
        stroke:#17dba5!important;
        stroke-width:1.35!important;
        stroke-linejoin:round!important;
      }
      body.sh-workspace-page .sh-sidebar-edge-chevron{
        fill:none!important;
        stroke:#72ffe1!important;
        stroke-width:2.5!important;
        stroke-linecap:round!important;
        stroke-linejoin:round!important;
        transform-box:fill-box;
        transform-origin:center;
        transition:transform .2s ease!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed > .sh-sidebar-collapse-btn .sh-sidebar-edge-chevron{
        transform:rotate(180deg);
      }
      @media (prefers-reduced-motion:reduce){
        body.sh-workspace-page > .sh-sidebar-collapse-btn,
        body.sh-workspace-page .sh-sidebar-edge-chevron{transition:none!important}
      }
      body.sh-workspace-page.sh-sidebar-collapsed{--sidebar-w:70px}
      body.sh-workspace-page.sh-sidebar-collapsed .app-shell>.sidebar{
        width:70px!important;min-width:70px!important;padding:12px 6px!important;
        overflow-x:hidden!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .app-shell>.main{
        margin-left:70px!important;width:calc(100% - 70px)!important;min-width:0!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .nav-title,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .sh-exact-brand-copy,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .brand-copy,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .documents-nav-chevron,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .documents-nav-toggle-left>span:not(.documents-nav-folder),
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .unified-main-nav>a>span:not(.side-icon){
        display:none!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .unified-brand{
        display:flex!important;justify-content:center!important;align-items:center!important;
        grid-template-columns:1fr!important;margin:0 auto 12px!important;
        width:100%!important;padding:4px 0 10px!important;min-height:48px!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .unified-brand>.sh-exact-brand-logo{
        display:block!important;width:40px!important;max-width:40px!important;
        height:40px!important;object-fit:cover!important;border-radius:10px!important;margin:0!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .unified-main-nav{
        gap:5px!important;align-items:center!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .unified-main-nav>a,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .documents-nav-group>.documents-nav-toggle,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .reports-nav-group>.documents-nav-toggle{
        align-items:center!important;justify-content:center!important;
        width:46px!important;max-width:46px!important;min-width:46px!important;
        min-height:44px!important;height:44px!important;
        padding:0!important;margin:2px auto!important;gap:0!important;
        overflow:hidden!important;border-radius:11px!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .documents-nav-toggle-left{
        display:flex!important;justify-content:center!important;align-items:center!important;
        width:100%!important;gap:0!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .side-icon,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .documents-nav-folder{
        display:flex!important;align-items:center!important;justify-content:center!important;
        flex:0 0 24px!important;width:24px!important;min-width:24px!important;
        margin:0!important;padding:0!important;line-height:1!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .documents-subnav{
        display:none!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .documents-nav-group,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .reports-nav-group{
        width:100%!important;max-width:100%!important;
      }
    }
    @media (max-width:760px){
      body.sh-workspace-page > .sh-sidebar-collapse-btn{display:none!important}
    }
    /* Premium B sidebar scrollbar: 8-10px glass rail with restrained glow.
       Only the sidebar scroll element is affected; content tables, the main
       frame, the mini-handle and saved scroll positions remain unchanged. */
    body.sh-workspace-page .app-shell>.sidebar{
      scrollbar-width:thin;
      scrollbar-color:#149f8c #0b1925;
    }
    body.sh-workspace-page .app-shell>.sidebar::-webkit-scrollbar{
      width:10px!important;height:10px!important;
      background:transparent!important;
    }
    body.sh-workspace-page .app-shell>.sidebar::-webkit-scrollbar-track{
      background:linear-gradient(180deg,#0a1924,#102332 55%,#091922)!important;
      border:1px solid rgba(79,151,170,.20)!important;
      border-radius:999px!important;
      box-shadow:inset 0 0 5px rgba(0,0,0,.33)!important;
    }
    body.sh-workspace-page .app-shell>.sidebar::-webkit-scrollbar-thumb{
      background:linear-gradient(180deg,#16d0ed,#24d3a4 55%,#0e9f93)!important;
      background-clip:padding-box!important;
      border:2px solid #0b1d29!important;
      border-radius:999px!important;
      min-height:46px!important;
      box-shadow:0 0 8px rgba(17,211,168,.23),inset 0 1px 1px rgba(231,255,252,.35)!important;
    }
    body.sh-workspace-page .app-shell>.sidebar::-webkit-scrollbar-thumb:hover{
      background:linear-gradient(180deg,#45e2fb,#43f5bf 58%,#16c5ac)!important;
      background-clip:padding-box!important;
      box-shadow:0 0 11px rgba(25,241,180,.38)!important;
    }
    body.sh-workspace-page .app-shell>.sidebar::-webkit-scrollbar-thumb:active{
      background:#47f2c5!important;
      background-clip:padding-box!important;
    }
    body.sh-workspace-page .app-shell>.sidebar::-webkit-scrollbar-button{
      display:none!important;width:0!important;height:0!important;
    }
    body.sh-workspace-page.sh-sidebar-collapsed .app-shell>.sidebar::-webkit-scrollbar{
      width:6px!important;
    }

    /* Premium language option C: three real native buttons, same language
       state and ARIA semantics. The select survives in the narrow rail. */
    body.sh-workspace-page .sidebar .sh-language-picker{
      display:flex;align-items:center;gap:9px;flex:0 0 auto;
      position:sticky;bottom:0;z-index:20;
      padding:8px 10px;margin:8px 0 2px;
      border-top:1px solid rgba(58,137,156,.23);
      background:linear-gradient(120deg,#0d1e2b,#091723);
      box-shadow:0 -7px 22px rgba(0,0,0,.13),inset 0 1px 0 rgba(132,209,233,.04);
      min-width:0;
    }
    body.sh-workspace-page .sidebar .sh-language-label{
      color:#41d7e8;
      font-size:17px;flex:0 0 20px;
      line-height:1;text-align:center;
      filter:drop-shadow(0 0 5px rgba(18,212,204,.14));
    }
    body.sh-workspace-page .sidebar .sh-language-segments{
      display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));
      align-items:stretch;gap:3px;flex:1 1 auto;
      width:100%;min-width:0;padding:3px;
      box-sizing:border-box;
      border:1px solid rgba(54,131,156,.54);border-radius:14px;
      background:linear-gradient(130deg,rgba(15,37,56,.97),rgba(10,23,39,.97));
      box-shadow:inset 0 2px 7px rgba(0,0,0,.20),0 2px 10px rgba(5,20,36,.16);
    }
    body.sh-workspace-page .sidebar .sh-language-segment{
      display:flex!important;align-items:center!important;justify-content:center!important;
      appearance:none!important;-webkit-appearance:none!important;
      min-width:0!important;min-height:37px!important;
      padding:0 4px!important;
      border:1px solid transparent!important;border-radius:11px!important;
      background:transparent!important;color:#b8cfde!important;
      font-family:"Space Grotesk",Inter,ui-sans-serif,system-ui,sans-serif!important;
      font-size:12px!important;font-weight:700!important;letter-spacing:.15px!important;
      line-height:1!important;cursor:pointer!important;
      box-shadow:none!important;
      transition:background .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease!important;
    }
    body.sh-workspace-page .sidebar .sh-language-segment:hover:not(.is-active){
      background:rgba(33,99,117,.34)!important;color:#f4fcff!important;
    }
    body.sh-workspace-page .sidebar .sh-language-segment.is-active{
      color:#e5fff5!important;
      border-color:rgba(63,239,186,.76)!important;
      background:linear-gradient(132deg,rgba(12,103,104,.66),rgba(14,66,80,.88))!important;
      box-shadow:0 0 13px rgba(17,223,167,.19),inset 0 1px 0 rgba(160,255,223,.11)!important;
      text-shadow:0 0 8px rgba(40,229,190,.26)!important;
    }
    body.sh-workspace-page .sidebar .sh-language-segment:focus-visible{
      outline:2px solid #75fbe0!important;outline-offset:2px!important;
    }
    /* Do not delete the native select: it is used by the 70px collapsed mode
       and kept in sync when languages change in another tab or iframe. */
    body.sh-workspace-page .sidebar .sh-language-select{
      display:none!important;
      color:#dff9f4!important;
      background:linear-gradient(120deg,#11283b,#0c2530)!important;
      border:1px solid rgba(55,214,184,.52)!important;
      border-radius:11px!important;
      height:40px;min-width:0;width:100%;padding:0 5px;
      font-size:12px;font-weight:700;cursor:pointer;
    }
    body.sh-workspace-page .sidebar .sh-language-select:focus-visible{
      outline:2px solid #75fbe0;outline-offset:2px;
    }
    @media (min-width:761px){
      /* Keep language selection visible even in a long authorized sidebar. */
      body.sh-workspace-page .app-shell>.sidebar{
        padding-bottom:72px!important;
      }
      body.sh-workspace-page .sidebar>.sh-language-picker{
        position:fixed!important;bottom:0!important;left:0!important;
        width:248px!important;max-width:248px!important;min-height:62px;
        box-sizing:border-box!important;margin:0!important;padding:8px 11px!important;
        z-index:160!important;border-right:1px solid rgba(55,125,142,.26);
      }
      body.sh-workspace-page.sh-sidebar-collapsed .app-shell>.sidebar{
        padding-bottom:72px!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar>.sh-language-picker{
        width:70px!important;max-width:70px!important;
        justify-content:center!important;padding:9px 11px!important;
        min-height:62px!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .sh-language-label,
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .sh-language-segments{
        display:none!important;
      }
      body.sh-workspace-page.sh-sidebar-collapsed .sidebar .sh-language-select{
        display:block!important;width:46px!important;max-width:46px!important;
        height:40px!important;padding:0 1px!important;text-align:center!important;
        font-size:11px!important;border-radius:10px!important;
      }
    }
    @media (prefers-reduced-motion:reduce){
      body.sh-workspace-page .sidebar .sh-language-segment{transition:none!important}
    }

  </style>
</head>
<body data-protected="true" class="sh-workspace-page">
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main sh-workspace-main">
      <header class="topbar sh-workspace-topbar">
        <div>
          <div class="topbar-title">Smart Horeca</div>
          <div class="topbar-sub">Dashboard · Внешние закупки · Внутренние заказы</div>
        </div>
        <div class="top-actions">
          <span class="sh-workspace-pilot-tag">Тест постоянного меню</span>
          <span class="sh-workspace-head-status" id="sh-workspace-status" role="status">Проверяем доступ</span>
          <button class="icon-btn" type="button" data-auth-logout>Выйти</button>
        </div>
      </header>
      <section class="sh-workspace-frame-host" id="sh-workspace-host" aria-label="Рабочий раздел">
        <div id="sh-nav-performance" class="sh-nav-performance" hidden aria-live="off"></div>
        <div class="sh-workspace-empty" id="sh-workspace-empty">Открываем доступный раздел Smart Horeca…</div>
      </section>
    </main>
  </div>

<script src="/sh-i18n.js"></script>
</body>
</html>
