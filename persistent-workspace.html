<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smart Horeca — постоянная навигация (пилот)</title>
  <script>document.documentElement.dataset.theme='dark';</script>
  <link rel="stylesheet" href="/app-shell.css?v=20261012-fast-nav1">
  <style id="sh-workspace-shell-style">
    body.sh-workspace-page{overflow:hidden;background:#0b1017!important}
    body.sh-workspace-page:not(.sh-workspace-ready) .sidebar{visibility:hidden!important}
    body.sh-workspace-page .sh-workspace-main{display:flex!important;flex-direction:column!important;height:100dvh!important;min-height:0!important;overflow:hidden!important}
    body.sh-workspace-page .sh-workspace-topbar{display:none!important}
    .sh-workspace-head-status{font-size:11px;color:#9aabb9}
    .sh-workspace-frame-host{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;background:#0b1017}
    .sh-workspace-frame{position:absolute;inset:0;display:block;width:100%;height:100%;border:0;background:#0b1017}
    .sh-workspace-frame.sh-pending{visibility:hidden;pointer-events:none}
    .sh-workspace-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#a1b1bf;font-size:14px}
    .sh-workspace-empty[hidden]{display:none!important}
    .sh-workspace-topbar .topbar-title{font-size:13px!important}\n    .sh-workspace-pilot-tag{font-size:11px;color:#63e0ac;border:1px solid #26543e;border-radius:8px;padding:6px 9px}
    @media(max-width:820px){body.sh-workspace-page .sh-workspace-topbar{padding:0 12px!important}.sh-workspace-pilot-tag{display:none}}
  </style>
</head>
<body data-protected="true" class="sh-workspace-page">
  <div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="main sh-workspace-main">
      <header class="topbar sh-workspace-topbar">
        <div>
          <div class="topbar-title">Smart Horeca</div>
          <div class="topbar-sub">Dashboard · Внешние закупки · Внутренние заказы</div>
        </div>
        <div class="top-actions">
          <span class="sh-workspace-pilot-tag">Тест постоянного меню</span>
          <span class="sh-workspace-head-status" id="sh-workspace-status" role="status">Проверяем доступ</span>
          <button class="icon-btn" type="button" data-auth-logout>Выйти</button>
        </div>
      </header>
      <section class="sh-workspace-frame-host" id="sh-workspace-host" aria-label="Рабочий раздел">
        <div class="sh-workspace-empty" id="sh-workspace-empty">Открываем доступный раздел Smart Horeca…</div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth-config.js"></script>
  <script src="/auth.js?v=20261012-nav-stable1"></script>
  <script src="/app-shell.js?v=20261012-workspace-pilot2"></script>
  <script src="/smart-horeca-sidebar-brand.js?v=20260917-7"></script>
  <script src="/documents-nav.js?v=20261012-nav-stable1"></script>
  <script src="/persistent-workspace.js?v=20261012-workspace-pilot2"></script>
</body>
</html>
