<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5" id="themeColor">
<title>QR Menu</title>
<style>
:root{--green:#0d6548;--green2:#117452;--cream:#f7f7f5;--card:#fff;--ink:#151816;--muted:#737874;--line:#e7e9e5;--soft:#eef3ef;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f1f2ef;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}.page{width:min(1180px,100%);margin:auto;min-height:100vh;background:var(--cream)}button,a{font:inherit}.hero{position:relative;min-height:430px;background:#173c2d;overflow:hidden;color:#fff}.hero-photo{position:absolute;inset:0;display:none}.hero-photo.show{display:block}.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}.hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#06120b55 0%,#07140b70 45%,#07120be8 100%)}.hero-content{position:relative;z-index:2;min-height:430px;padding:26px 22px 42px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}.hero-tools{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}.tool-btn{width:44px;height:44px;border:1px solid #ffffff35;background:#ffffff20;color:#fff;border-radius:50%;display:grid;place-items:center;backdrop-filter:blur(12px);cursor:pointer;font-size:21px}.language{width:auto;padding:0 14px;border-radius:22px;font-size:13px}.hero-logo{width:92px;height:92px;border-radius:50%;background:#fff;color:var(--green);border:4px solid #fff;display:grid;place-items:center;overflow:hidden;font-size:30px;font-weight:900;margin-bottom:16px;box-shadow:0 8px 30px #0004}.hero-logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#dcefe6;margin-bottom:7px}.hero h1{font-size:42px;line-height:1.05;margin:0;font-weight:800;letter-spacing:-1.5px}.hero p{font-size:16px;margin:10px 0 0;color:#e5ece8;max-width:620px;line-height:1.45}.updated{display:none}.content{background:var(--cream)}.cat-nav{position:sticky;top:0;z-index:20;display:flex;gap:12px;overflow:auto;padding:16px 18px;background:#ffffffed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);scrollbar-width:none}.cat-nav::-webkit-scrollbar{display:none}.cat-chip{flex:0 0 122px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid #e4e7e3;border-radius:18px;padding:0 0 10px;overflow:hidden;box-shadow:0 3px 12px #17231a0b}.cat-chip.active{border:2px solid var(--green);padding-bottom:9px}.cat-chip-img{height:76px;background:#dfe6e1;overflow:hidden}.cat-chip-img img{width:100%;height:100%;object-fit:cover;display:block}.cat-chip-name{display:block;padding:8px 9px 0;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}.menu{padding:18px 20px 96px}.cat-section{scroll-margin-top:170px;margin:22px 0 10px}.cat-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.cat-heading h2{margin:0;font-size:25px;letter-spacing:-.7px}.cat-count{color:var(--muted);font-size:13px}.dish{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:15px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin:10px 0;box-shadow:0 4px 18px #17231a08;cursor:pointer;transition:transform .18s,box-shadow .18s}.dish:hover{transform:translateY(-1px);box-shadow:0 8px 25px #17231a12}.photo{width:118px;height:96px;border-radius:15px;overflow:hidden;background:#e7ece8;display:grid;place-items:center;color:#87908b;font-size:28px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.dish-main{min-width:0}.name{font-size:18px;font-weight:800;line-height:1.2;margin-bottom:5px}.desc{font-size:13px;color:var(--muted);line-height:1.42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.composition{display:none}.meta{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}.allergen{width:28px;height:28px;border:1.5px solid #141816;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#fff}.cal{background:#eef0ed;border:1px solid #d7dbd7;border-radius:16px;padding:6px 9px;font-size:11px;font-weight:750;white-space:nowrap}.price{font-size:17px;font-weight:850;color:var(--green);white-space:nowrap;align-self:center}.arrow{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--green);display:grid;place-items:center;font-size:23px;margin-left:7px}.dish-right{display:flex;align-items:center;gap:8px}.info-block{margin:24px 0;padding:18px;border-radius:20px;background:#edf3ef;border:1px solid #dfe8e2}.info-block h3{margin:0 0 8px;font-size:17px}.info-block p{margin:0;color:#5e665f;font-size:13px;line-height:1.6}.feedback{margin:20px 0;padding:22px;text-align:center;border-radius:20px;background:var(--green);color:#eaf5ef}.feedback strong{display:block;font-size:17px;margin-bottom:5px}.feedback span{font-size:12px;color:#d2e8dd}.footer{padding:20px;text-align:center;color:#8a908c;font-size:10px;letter-spacing:1px;border-top:1px solid var(--line)}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);z-index:30;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 18px calc(8px + env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.bottom-nav button{border:0;background:none;color:#5e655f;padding:5px 4px;display:grid;gap:3px;justify-items:center;font-size:11px;cursor:pointer}.bottom-nav button.active{color:var(--green);font-weight:750}.nav-icon{font-size:22px;line-height:1}.detail-overlay{position:fixed;inset:0;z-index:100;background:#0007;display:none;align-items:flex-end;justify-content:center}.detail-overlay.show{display:flex}.detail-sheet{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -20px 70px #0004}.detail-photo{height:310px;position:relative;background:#e7ece8}.detail-photo img{width:100%;height:100%;object-fit:cover}.detail-top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between}.detail-btn{width:44px;height:44px;border:0;border-radius:50%;background:#ffffffd9;display:grid;place-items:center;font-size:23px;cursor:pointer}.detail-body{padding:22px 22px calc(24px + env(safe-area-inset-bottom))}.detail-title-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.detail-title{font-size:28px;font-weight:850;line-height:1.15}.detail-price{font-size:22px;font-weight:850;color:var(--green);white-space:nowrap}.detail-desc{font-size:16px;color:#636a65;line-height:1.55;margin:13px 0}.detail-composition{padding:16px;border-radius:18px;background:#f0f3ef;margin:17px 0;color:#535a55;font-size:14px;line-height:1.55}.detail-composition strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}.detail-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.close-detail{width:100%;border:0;background:var(--green);color:#fff;border-radius:18px;padding:15px;font-weight:800;font-size:16px;margin-top:20px;cursor:pointer}.error{padding:70px 20px;text-align:center;color:#9a5757}.loading{padding:70px 20px;text-align:center;color:#8b918c}@media(min-width:800px){.page{box-shadow:0 0 50px #00000010}.hero-content{min-height:500px}.hero h1{font-size:54px}.menu{padding-left:40px;padding-right:40px}.cat-nav{padding-left:40px;padding-right:40px}.bottom-nav{display:none}.menu{padding-bottom:50px}.detail-overlay{align-items:center;padding:20px}.detail-sheet{border-radius:28px;max-height:90vh}.detail-photo{height:330px}}
@media(max-width:600px){.hero{min-height:390px}.hero-content{min-height:390px;padding-bottom:34px}.hero h1{font-size:36px}.hero p{font-size:14px}.hero-logo{width:80px;height:80px}.cat-nav{padding:13px 14px}.cat-chip{flex-basis:112px}.cat-chip-img{height:70px}.menu{padding:12px 14px 90px}.dish{grid-template-columns:82px minmax(0,1fr);gap:11px;padding:10px;border-radius:18px}.photo{width:82px;height:74px;border-radius:12px;grid-row:1 / span 2}.dish-main{align-self:start}.name{font-size:15px}.desc{font-size:12px}.dish-right{grid-column:2;justify-content:space-between}.price{font-size:16px}.arrow{width:34px;height:34px}.detail-photo{height:280px}.detail-title{font-size:24px}.detail-price{font-size:19px}.detail-desc{font-size:14px}}
</style>
</head>
<body>
<div class="page">
<header class="hero">
  <div class="hero-photo" id="heroPhoto"></div>
  <div class="hero-tools"><button class="tool-btn language" id="languageBtn">AZ⌄</button><div style="display:flex;gap:8px"><button class="tool-btn" id="searchBtn" aria-label="Axtar">⌕</button><button class="tool-btn" id="menuBtn" aria-label="Menyu">☰</button></div></div>
  <div class="hero-content"><div class="hero-logo" id="heroLogo">A</div><div class="eyebrow">RESTAURANT &amp; LOUNGE</div><h1 id="restaurant">Anar Restaurant</h1><p id="tagline">Dadlı yeməklər, xoş anlar</p><span class="updated" id="updated"></span></div>
</header>
<div class="content">
<nav class="cat-nav" id="catNav"></nav>
<section class="menu">
  <div id="aboutBlock" class="info-block" style="display:none"></div>
  <div id="content"><div class="loading">Menyu yüklənir…</div></div>
  <div id="feedback" class="feedback" style="display:none"><strong>Bizimlə olduğunuz üçün təşəkkürlər</strong><span>Fikirləriniz bizim üçün dəyərlidir.</span></div>
</section>
<footer class="footer">DIGITAL MENU • <span id="footerName">ANAR RESTAURANT</span></footer>
</div>
</div>
<nav class="bottom-nav"><button class="active" id="homeBtn"><span class="nav-icon">⌂</span>Menyu</button><button id="favBtn"><span class="nav-icon">♡</span>Seçilənlər</button><button id="aboutBtn"><span class="nav-icon">ⓘ</span>Haqqımızda</button></nav>
<div class="detail-overlay" id="detailOverlay"><article class="detail-sheet"><div class="detail-photo" id="detailPhoto"><div class="detail-top"><button class="detail-btn" id="detailCloseTop">←</button><button class="detail-btn" id="detailFav">♡</button></div></div><div class="detail-body"><div class="detail-title-row"><div class="detail-title" id="detailTitle"></div><div class="detail-price" id="detailPrice"></div></div><div class="detail-desc" id="detailDesc"></div><div class="detail-composition" id="detailComposition" style="display:none"></div><div class="detail-meta" id="detailMeta"></div><button class="close-detail" id="detailClose">Bağla</button></div></article></div>
<script>
const DEFAULT={name:'Anar Restaurant',tagline:'Dadlı yeməklər, xoş anlar',about:'Xoş gəlmisiniz. Burada restoranımızın aktual menyusunu tapa bilərsiniz.',accent:'#0d6548',text:'#151816',bg:'#f7f7f5',surface:'#ffffff',theme:'light',font:'Inter',radius:'20px',hero:'',logo:'',phone:'',address:'',hours:'',social:'',wifi:'',showPrices:true,showDescriptions:true,showComposition:true,showAbout:true,showContacts:true};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let DATA=null, DESIGN=DEFAULT, FAVORITES=new Set();
function setImage(el,src,alt=''){el.textContent='';if(!src)return;const img=document.createElement('img');img.src=src;img.alt=alt;img.loading='eager';img.referrerPolicy='no-referrer';img.onerror=()=>{el.textContent='🍽️';};el.appendChild(img)}
function money(x){const n=Number(x||0);const cur=String(x?.currency||'AZN');return n.toLocaleString('az-AZ',{maximumFractionDigits:0})+' '+(cur==='AZN'?'₼':cur)}
function applyDesign(raw){DESIGN={...DEFAULT,...(raw||{})};const d=DESIGN;document.documentElement.style.setProperty('--green',d.accent||DEFAULT.accent);document.documentElement.style.setProperty('--ink',d.text||DEFAULT.text);document.documentElement.style.setProperty('--cream',d.bg||DEFAULT.bg);document.getElementById('themeColor').content=d.bg||DEFAULT.bg;document.body.style.background=d.bg||DEFAULT.bg;document.getElementById('restaurant').textContent=d.name||DEFAULT.name;document.getElementById('footerName').textContent=(d.name||DEFAULT.name).toUpperCase();document.getElementById('tagline').textContent=d.tagline||DEFAULT.tagline;const hp=document.getElementById('heroPhoto');setImage(hp,d.hero,'Restoran');hp.classList.toggle('show',!!d.hero);const logo=document.getElementById('heroLogo');if(d.logo)setImage(logo,d.logo,'Loqo');else logo.textContent=(d.name||'A').slice(0,1).toUpperCase();document.getElementById('aboutBlock').style.display=d.showAbout&&d.about?'block':'none';document.getElementById('aboutBlock').innerHTML=d.showAbout&&d.about?'<h3>Haqqımızda</h3><p>'+esc(d.about)+'</p>':'';}
function categoryPhoto(cat,dishes){const first=dishes.find(x=>String(x.cat)===String(cat.id)&&x.photo);return first?.photo||''}
function allergenIcons(x){let out='';const txt=String(x.allergens||x.allergen||'').toLowerCase();if(x.vegan||txt.includes('vegan'))out+='<span class="allergen">🌿</span>';if(x.vegetarian||txt.includes('vegetarian'))out+='<span class="allergen">🥬</span>';if(txt.includes('milk')||txt.includes('süd')||txt.includes('dairy'))out+='<span class="allergen">🥛</span>';if(txt.includes('egg')||txt.includes('yumurta'))out+='<span class="allergen">🥚</span>';return out}
function dishHtml(x,d){const photo=x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.name)+'" loading="lazy">':'🍽️';const desc=d.showDescriptions&&x.desc?'<div class="desc">'+esc(x.desc)+'</div>':'';const icons=allergenIcons(x);const cal=x.calories||x.kcal?'<span class="cal">🔥 '+esc(x.calories||x.kcal)+' kcal</span>':'';const meta=(cal||icons)?'<div class="meta">'+cal+icons+'</div>':'';const price=d.showPrices?'<div class="price">'+money({currency:x.currency,price:x.price})+'</div>':'';return '<article class="dish" data-id="'+esc(x.id||x.iikoId||x.name)+'"><div class="photo">'+photo+'</div><div class="dish-main"><div class="name">'+esc(x.name)+'</div>'+desc+meta+'</div><div class="dish-right">'+price+'<span class="arrow">›</span></div></article>'}
function render(){const cats=DATA?.menu?.categories||[],dishes=(DATA?.menu?.dishes||[]).filter(x=>x.isAvailable!==false);const nav=document.getElementById('catNav');nav.innerHTML=cats.map((c,i)=>{const p=categoryPhoto(c,dishes);return '<a class="cat-chip '+(i===0?'active':'')+'" href="#cat-'+encodeURIComponent(c.id)+'" data-cat="'+esc(c.id)+'">'+(p?'<div class="cat-chip-img"><img src="'+esc(p)+'" alt=""></div>':'<div class="cat-chip-img"></div>')+'<span class="cat-chip-name">'+esc(c.name)+'</span></a>'}).join('');let html='';const used=new Set();for(const c of cats){const list=dishes.filter(x=>String(x.cat)===String(c.id));if(!list.length)continue;used.add(String(c.id));html+='<section class="cat-section" id="cat-'+encodeURIComponent(c.id)+'"><div class="cat-heading"><h2>'+esc(c.name)+'</h2><span class="cat-count">'+list.length+' yemək</span></div>'+list.map(x=>dishHtml(x,DESIGN)).join('')+'</section>'}const unc=dishes.filter(x=>!used.has(String(x.cat)));if(unc.length)html+='<section class="cat-section" id="cat-other"><div class="cat-heading"><h2>Menyu</h2><span class="cat-count">'+unc.length+' yemək</span></div>'+unc.map(x=>dishHtml(x,DESIGN)).join('')+'</section>';document.getElementById('content').innerHTML=html||'<div class="loading">Menyuda hazırda əlçatan yemək yoxdur.</div>';document.getElementById('feedback').style.display='block';bindDishClicks()}
function findDish(id){return (DATA?.menu?.dishes||[]).find(x=>String(x.id||x.iikoId||x.name)===String(id))}
function openDish(x){if(!x)return;const dp=document.getElementById('detailPhoto');const src=x.photo||'';dp.innerHTML='<div class="detail-top"><button class="detail-btn" id="detailCloseTop">←</button><button class="detail-btn" id="detailFav">'+(FAVORITES.has(String(x.id||x.iikoId||x.name))?'♥':'♡')+'</button></div>';if(src){const img=document.createElement('img');img.src=src;img.alt=x.name||'';dp.insertBefore(img,dp.firstChild)}else dp.insertBefore(document.createTextNode('🍽️'),dp.firstChild);document.getElementById('detailTitle').textContent=x.name||'';document.getElementById('detailPrice').textContent=DESIGN.showPrices?money({currency:x.currency,price:x.price}):'';document.getElementById('detailDesc').textContent=DESIGN.showDescriptions?(x.desc||''):'';const comp=document.getElementById('detailComposition');const composition=x.composition&&x.composition!==x.desc?x.composition:'';comp.style.display=DESIGN.showComposition&&composition?'block':'none';comp.innerHTML=composition?'<strong>🌿 Tərkibi</strong>'+esc(composition):'';document.getElementById('detailMeta').innerHTML=((x.calories||x.kcal)?'<span class="cal">🔥 '+esc(x.calories||x.kcal)+' kcal</span>':'')+allergenIcons(x);document.getElementById('detailOverlay').classList.add('show');document.body.style.overflow='hidden';document.getElementById('detailCloseTop').onclick=closeDish;document.getElementById('detailFav').onclick=()=>toggleFavorite(x);}
function closeDish(){document.getElementById('detailOverlay').classList.remove('show');document.body.style.overflow=''}
function toggleFavorite(x){const id=String(x.id||x.iikoId||x.name);if(FAVORITES.has(id))FAVORITES.delete(id);else FAVORITES.add(id);localStorage.setItem('qr_menu_favorites',JSON.stringify([...FAVORITES]));openDish(x)}
function bindDishClicks(){document.querySelectorAll('.dish').forEach(el=>el.addEventListener('click',()=>openDish(findDish(el.dataset.id))))}
function showFavorites(){const dishes=(DATA?.menu?.dishes||[]).filter(x=>FAVORITES.has(String(x.id||x.iikoId||x.name)));if(!dishes.length){document.getElementById('content').innerHTML='<div class="loading">Hələ seçilən yemək yoxdur.</div>';return}document.getElementById('content').innerHTML='<section class="cat-section"><div class="cat-heading"><h2>Seçilənlər</h2><span class="cat-count">'+dishes.length+' yemək</span></div>'+dishes.map(x=>dishHtml(x,DESIGN)).join('')+'</section>';bindDishClicks()}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('content').innerHTML='<div class="error">Menyu linki natamamdır.</div>';return}try{const r=await fetch('/api/qr-menu/public?id='+encodeURIComponent(id),{cache:'no-store'});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.message||'Menyu tapılmadı');DATA=data;applyDesign(data.design);if(data.updatedAt)document.getElementById('updated').textContent='Yenilənib '+new Date(data.updatedAt).toLocaleString('az-AZ');try{FAVORITES=new Set(JSON.parse(localStorage.getItem('qr_menu_favorites')||'[]'))}catch{FAVORITES=new Set()}render()}catch(e){document.getElementById('content').innerHTML='<div class="error">Menyunu yükləmək mümkün olmadı.<br><br>'+esc(e.message)+'</div>'}}
document.getElementById('detailClose').onclick=closeDish;document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target.id==='detailOverlay')closeDish()});document.getElementById('favBtn').onclick=()=>{document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));document.getElementById('favBtn').classList.add('active');showFavorites();window.scrollTo({top:document.querySelector('.cat-nav')?.offsetTop||0,behavior:'smooth'})};document.getElementById('homeBtn').onclick=()=>{render();document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));document.getElementById('homeBtn').classList.add('active');window.scrollTo({top:0,behavior:'smooth'})};document.getElementById('aboutBtn').onclick=()=>{document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));document.getElementById('aboutBtn').classList.add('active');const a=document.getElementById('aboutBlock');a.style.display='block';a.scrollIntoView({behavior:'smooth',block:'center'})};document.getElementById('searchBtn').onclick=()=>{const q=prompt('Yemək axtar:');if(!q)return;const needle=q.toLowerCase();const found=(DATA?.menu?.dishes||[]).filter(x=>String(x.name||'').toLowerCase().includes(needle)||String(x.desc||'').toLowerCase().includes(needle));document.getElementById('content').innerHTML=found.length?'<section class="cat-section"><div class="cat-heading"><h2>Axtarış</h2><span class="cat-count">'+found.length+' nəticə</span></div>'+found.map(x=>dishHtml(x,DESIGN)).join('')+'</section>':'<div class="loading">Nəticə tapılmadı.</div>';bindDishClicks()};document.getElementById('menuBtn').onclick=()=>document.querySelector('.cat-nav')?.scrollIntoView({behavior:'smooth'});document.querySelectorAll('.cat-nav').forEach(()=>{});load();
</script>
</body>
</html>
