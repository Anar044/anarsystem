<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251d" id="themeColor">
<title>QR Menu</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg,#f4f6f5);color:var(--text,#17211c);font-family:var(--font,Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif)}.wrap{max-width:860px;margin:auto;background:var(--surface,#fff);min-height:100vh;box-shadow:0 0 50px #10251d12}.hero{position:relative;background:var(--accent,#10251d);color:#fff;padding:0 22px 30px;text-align:center;overflow:hidden}.hero-photo{height:250px;background-size:cover;background-position:center;position:relative;display:none}.hero-photo.show{display:block}.hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0001,#0009)}.hero-content{position:relative;margin-top:0}.hero-logo{position:relative;margin:-40px auto 10px;width:82px;height:82px;border-radius:50%;border:4px solid #fff;background:#fff;display:grid;place-items:center;overflow:hidden;font-weight:900;font-size:25px;color:var(--accent,#10251d);z-index:2}.hero-logo img{width:100%;height:100%;object-fit:cover}.hero h1{position:relative;margin:0;font-size:31px;letter-spacing:-.5px}.hero p{position:relative;margin:7px 0 0;color:#ffffffcc;font-size:13px}.badge{position:relative;display:inline-flex;margin-top:14px;padding:6px 10px;border:1px solid #ffffff55;border-radius:99px;color:#fff;font-size:10px;background:#ffffff12}.sticky{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface,#fff) 94%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--text,#17211c) 10%,transparent);padding:10px 16px}.cat-nav{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.cat-nav::-webkit-scrollbar{display:none}.cat-nav a{flex:none;text-decoration:none;color:var(--text,#53625b);background:color-mix(in srgb,var(--bg,#f0f3f1) 90%,var(--accent,#42d392));border:1px solid color-mix(in srgb,var(--text,#17211c) 10%,transparent);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:700}.cat-nav a:first-child{background:var(--accent,#17372a);color:#fff;border-color:var(--accent,#17372a)}.content{padding:18px 20px 35px}.cat{scroll-margin-top:65px;margin:24px 0 9px;font-size:20px;font-weight:850;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;color:var(--text,#17211c)}.cat:first-child{margin-top:5px}.cat:after{content:"";height:1px;background:color-mix(in srgb,var(--text,#17211c) 12%,transparent);flex:1}.dish{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid color-mix(in srgb,var(--text,#17211c) 10%,transparent)}.photo{width:92px;height:92px;border-radius:var(--radius,16px);background:var(--bg,#edf2ef);overflow:hidden;flex:none;display:grid;place-items:center;font-size:27px;color:#809087}.photo img{width:100%;height:100%;object-fit:cover;display:block}.info{min-width:0;flex:1}.name{font-size:15px;font-weight:850;line-height:1.25;color:var(--text,#17211c)}.desc{font-size:12px;color:color-mix(in srgb,var(--text,#68766f) 62%,transparent);line-height:1.5;margin-top:6px}.composition{font-size:11px;color:color-mix(in srgb,var(--text,#8a9690) 55%,transparent);line-height:1.45;margin-top:5px}.price{font-size:15px;font-weight:900;white-space:nowrap;color:var(--accent,#17211c)}.info-block{margin:18px 0;padding:16px;border-radius:var(--radius,16px);background:color-mix(in srgb,var(--bg,#f4f6f5) 88%,var(--accent,#d4af37));border:1px solid color-mix(in srgb,var(--accent,#d4af37) 22%,transparent);line-height:1.55;font-size:12px}.info-block h3{margin:0 0 8px;font-size:15px;color:var(--text,#17211c)}.contact-list{display:grid;gap:6px}.contact-row{display:flex;gap:8px}.feedback{margin-top:18px;padding:17px;border-radius:var(--radius,16px);background:var(--accent,#17372a);color:#fff;text-align:center}.feedback strong{font-size:15px}.footer{padding:22px;text-align:center;color:color-mix(in srgb,var(--text,#89958f) 55%,transparent);font-size:10px;border-top:1px solid color-mix(in srgb,var(--text,#17211c) 10%,transparent)}.loading,.error{padding:60px 20px;text-align:center;color:#65736d}.error{color:#a13d3d}.dark{--surface:#111;--bg:#181818}.dark .sticky{background:#111f}.dark .cat-nav a{color:#ddd;background:#222;border-color:#333}.dark .desc{color:#aaa}.dark .composition{color:#888}.dark .info-block{background:#1d1d1d;border-color:#333}.dark .dish{border-color:#2b2b2b}@media(max-width:520px){.hero{padding-left:16px;padding-right:16px}.hero-photo{height:210px}.content{padding:15px 16px 28px}.photo{width:78px;height:78px}.name{font-size:14px}.price{font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero" id="hero"><div class="hero-photo" id="heroPhoto"></div><div class="hero-content"><div class="hero-logo" id="heroLogo">M</div><h1 id="restaurant">QR Menu</h1><p id="tagline">Цифровое меню ресторана</p><span class="badge" id="updated"></span></div></header>
<nav class="sticky"><div class="cat-nav" id="catNav"></div></nav>
<section class="content"><div class="info-block" id="aboutBlock" style="display:none"></div><div class="info-block" id="contactBlock" style="display:none"></div><div id="content"><div class="loading">Загрузка меню…</div></div><div class="feedback" id="feedback" style="display:none"><strong>Спасибо, что вы с нами!</strong><br><span>Ваше мнение помогает нам становиться лучше.</span></div></section>
<footer class="footer">Цифровое меню ресторана</footer>
</main>
<script>
const DEFAULT={name:'QR Menu',tagline:'Цифровое меню ресторана',about:'',accent:'#10251d',text:'#17211c',bg:'#f4f6f5',surface:'#ffffff',theme:'light',font:'Inter',radius:'16px',hero:'',logo:'',phone:'',address:'',hours:'',social:'',wifi:'',showPrices:true,showDescriptions:true,showComposition:true,showAbout:true,showContacts:true};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function applyDesign(raw){const d={...DEFAULT,...(raw||{})};const root=document.documentElement;root.style.setProperty('--accent',d.accent||DEFAULT.accent);root.style.setProperty('--text',d.text||DEFAULT.text);root.style.setProperty('--bg',d.bg||DEFAULT.bg);root.style.setProperty('--surface',d.surface||DEFAULT.surface);root.style.setProperty('--radius',d.radius||DEFAULT.radius);root.style.setProperty('--font',d.font==='system'?'system-ui':(d.font||'Inter'));if(d.theme==='dark'){document.body.classList.add('dark');if(!d.bg||d.bg===DEFAULT.bg)root.style.setProperty('--bg','#181818');if(!d.surface||d.surface===DEFAULT.surface)root.style.setProperty('--surface','#111');if(!d.text||d.text===DEFAULT.text)root.style.setProperty('--text','#f2f2f2');}else document.body.classList.remove('dark');document.getElementById('themeColor').content=d.accent||DEFAULT.accent;document.getElementById('restaurant').textContent=d.name||DEFAULT.name;document.getElementById('tagline').textContent=d.tagline||DEFAULT.tagline;const hp=document.getElementById('heroPhoto');hp.style.backgroundImage=d.hero?'url("'+d.hero+'")':'';hp.classList.toggle('show',!!d.hero);const logo=document.getElementById('heroLogo');logo.innerHTML=d.logo?'<img src="'+esc(d.logo)+'" alt="logo">':esc((d.name||'M').slice(0,1));logo.style.borderColor=d.accent||DEFAULT.accent;logo.style.color=d.accent||DEFAULT.accent;return d;}
function dishHtml(x,d){const photo=x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.name)+'" loading="lazy">':'🍽️';const desc=d.showDescriptions?(x.desc||''):'';const comp=d.showComposition&&x.composition&&x.composition!==x.desc?'Состав: '+x.composition:'';return '<article class="dish"><div class="photo">'+photo+'</div><div class="info"><div class="name">'+esc(x.name)+'</div>'+(desc?'<div class="desc">'+esc(desc)+'</div>':'')+(comp?'<div class="composition">'+esc(comp)+'</div>':'')+'</div>'+(d.showPrices?'<div class="price">'+Number(x.price||0).toFixed(2)+' '+esc(x.currency||'AZN')+'</div>':'')+'</article>';}
function infoBlocks(d){const about=document.getElementById('aboutBlock');about.style.display=d.showAbout&&d.about?'block':'none';about.innerHTML=d.showAbout&&d.about?'<h3>О ресторане</h3>'+esc(d.about):'';const rows=[d.phone&&('📞 '+d.phone),d.address&&('📍 '+d.address),d.hours&&('🕒 '+d.hours),d.social&&('◎ '+d.social),d.wifi&&('📶 '+d.wifi)].filter(Boolean);const contact=document.getElementById('contactBlock');contact.style.display=d.showContacts&&rows.length?'block':'none';contact.innerHTML=d.showContacts&&rows.length?'<h3>Контакты</h3><div class="contact-list">'+rows.map(x=>'<div class="contact-row">'+esc(x)+'</div>').join('')+'</div>':'';}
async function load(){const id=new URLSearchParams(location.search).get('id');const content=document.getElementById('content');if(!id){content.innerHTML='<div class="error">Ссылка на меню неполная.</div>';return;}try{const r=await fetch('/api/qr-menu/public?id='+encodeURIComponent(id),{cache:'no-store'});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.message||'Меню не найдено');const d=applyDesign(data.design);infoBlocks(d);if(data.updatedAt)document.getElementById('updated').textContent='Обновлено '+new Date(data.updatedAt).toLocaleString('ru-RU');const cats=data.menu?.categories||[],dishes=(data.menu?.dishes||[]).filter(x=>x.isAvailable!==false);const nav=document.getElementById('catNav');nav.innerHTML=cats.map(c=>'<a href="#cat-'+encodeURIComponent(c.id)+'">'+esc(c.name)+'</a>').join('');const used=new Set();let html='';for(const c of cats){const list=dishes.filter(x=>String(x.cat)===String(c.id));if(!list.length)continue;used.add(String(c.id));html+='<h2 class="cat" id="cat-'+encodeURIComponent(c.id)+'">'+esc(c.name)+'</h2>'+list.map(x=>dishHtml(x,d)).join('');}const uncategorized=dishes.filter(x=>!used.has(String(x.cat)));if(uncategorized.length)html+='<h2 class="cat" id="cat-other">Меню</h2>'+uncategorized.map(x=>dishHtml(x,d)).join('');content.innerHTML=html||'<div class="loading">В меню пока нет блюд.</div>';document.getElementById('feedback').style.display='block';}catch(e){content.innerHTML='<div class="error">Не удалось загрузить меню.<br><br>'+esc(e.message)+'</div>';}}
load();
</script>
</body>
</html>
