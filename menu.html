<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251d">
<title>QR Menu</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f6f5;color:#17211c;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:820px;margin:auto;background:#fff;min-height:100vh;box-shadow:0 0 50px #10251d12}.hero{position:relative;background:linear-gradient(145deg,#10251d,#17372a);color:#fff;padding:42px 22px 28px;text-align:center;overflow:hidden}.hero:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:#42d39218;right:-80px;top:-110px}.hero h1{position:relative;margin:0;font-size:30px;letter-spacing:-.5px}.hero p{position:relative;margin:7px 0 0;color:#b5c9c0;font-size:13px}.badge{position:relative;display:inline-flex;margin-top:14px;padding:6px 10px;border:1px solid #4a7563;border-radius:99px;color:#d0e2da;font-size:10px;background:#ffffff08}.sticky{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid #e4e9e6;padding:10px 16px}.cat-nav{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.cat-nav::-webkit-scrollbar{display:none}.cat-nav a{flex:none;text-decoration:none;color:#53625b;background:#f0f3f1;border:1px solid #e0e6e2;border-radius:99px;padding:8px 12px;font-size:11px;font-weight:700}.cat-nav a:first-child{background:#17372a;color:#fff;border-color:#17372a}.content{padding:18px 20px 35px}.cat{scroll-margin-top:65px;margin:24px 0 9px;font-size:20px;font-weight:850;letter-spacing:-.2px;display:flex;align-items:center;gap:9px}.cat:first-child{margin-top:5px}.cat:after{content:"";height:1px;background:#e4e9e6;flex:1}.dish{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid #e8ece9}.photo{width:92px;height:92px;border-radius:15px;background:#edf2ef;overflow:hidden;flex:none;display:grid;place-items:center;font-size:27px;color:#809087}.photo img{width:100%;height:100%;object-fit:cover;display:block}.info{min-width:0;flex:1}.name{font-size:15px;font-weight:850;line-height:1.25}.desc{font-size:12px;color:#68766f;line-height:1.5;margin-top:6px}.composition{font-size:11px;color:#8a9690;line-height:1.45;margin-top:5px}.price{font-size:15px;font-weight:900;white-space:nowrap;color:#17211c}.loading,.error{padding:60px 20px;text-align:center;color:#65736d}.error{color:#a13d3d}.footer{padding:22px;text-align:center;color:#89958f;font-size:10px;border-top:1px solid #e6ebe8}@media(max-width:520px){.hero{padding-top:34px}.content{padding:15px 16px 28px}.photo{width:78px;height:78px}.name{font-size:14px}.price{font-size:13px}}
</style>
</head>
<body>
<main class="wrap">
<header class="hero"><h1 id="restaurant">QR Menu</h1><p>Цифровое меню ресторана</p><span class="badge" id="updated"></span></header>
<nav class="sticky"><div class="cat-nav" id="catNav"></div></nav>
<section class="content" id="content"><div class="loading">Загрузка меню…</div></section>
<footer class="footer">Цифровое меню ресторана</footer>
</main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function dishHtml(x){
 const photo=x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.name)+'" loading="lazy">':'🍽️';
 const desc=x.desc||'';
 const comp=x.composition&&x.composition!==desc?'Состав: '+x.composition:'';
 return '<article class="dish"><div class="photo">'+photo+'</div><div class="info"><div class="name">'+esc(x.name)+'</div>'+(desc?'<div class="desc">'+esc(desc)+'</div>':'')+(comp?'<div class="composition">'+esc(comp)+'</div>':'')+'</div><div class="price">'+Number(x.price||0).toFixed(2)+' '+esc(x.currency||'AZN')+'</div></article>';
}
async function load(){
 const id=new URLSearchParams(location.search).get('id');
 const content=document.getElementById('content');
 if(!id){content.innerHTML='<div class="error">Ссылка на меню неполная.</div>';return;}
 try{
  const r=await fetch('/api/qr-menu/public?id='+encodeURIComponent(id),{cache:'no-store'});
  const d=await r.json();
  if(!r.ok||!d.success) throw new Error(d.message||'Меню не найдено');
  document.getElementById('restaurant').textContent=d.restaurantName||'QR Menu';
  if(d.updatedAt)document.getElementById('updated').textContent='Обновлено '+new Date(d.updatedAt).toLocaleString('ru-RU');
  const cats=d.menu?.categories||[], dishes=(d.menu?.dishes||[]).filter(x=>x.isAvailable!==false);
  const nav=document.getElementById('catNav');
  nav.innerHTML=cats.map(c=>'<a href="#cat-'+encodeURIComponent(c.id)+'">'+esc(c.name)+'</a>').join('');
  const used=new Set();let html='';
  for(const c of cats){
   const list=dishes.filter(x=>String(x.cat)===String(c.id));
   if(!list.length)continue;
   used.add(String(c.id));
   html+='<h2 class="cat" id="cat-'+encodeURIComponent(c.id)+'">'+esc(c.name)+'</h2>';
   html+=list.map(dishHtml).join('');
  }
  const uncategorized=dishes.filter(x=>!used.has(String(x.cat)));
  if(uncategorized.length){html+='<h2 class="cat" id="cat-other">Меню</h2>'+uncategorized.map(dishHtml).join('');}
  content.innerHTML=html||'<div class="loading">В меню пока нет блюд.</div>';
 }catch(e){content.innerHTML='<div class="error">Не удалось загрузить меню.<br><br>'+esc(e.message)+'</div>';}
}
load();
</script>
</body>
</html>
