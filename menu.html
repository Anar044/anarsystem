<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa" id="themeColor">
<title>QR Menu</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg,#f5f7fa);color:var(--text,#17202a);font-family:var(--font,Inter),system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.page{width:min(1120px,100%);margin:auto;min-height:100vh;background:var(--bg,#f5f7fa)}button,a{font:inherit}.hero{position:relative;min-height:360px;background:var(--surface,#fff);overflow:hidden}.hero-photo{position:absolute;inset:0;display:none;overflow:hidden}.hero-photo.show{display:block}.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0002 0%,#0007 55%,#000b 100%)}.hero-content{position:relative;z-index:2;min-height:360px;padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:flex-end}.hero-logo{width:76px;height:76px;border:2px solid var(--accent,#c6a45a);border-radius:50%;background:var(--surface,#fff);display:grid;place-items:center;overflow:hidden;font-family:Georgia,serif;font-size:27px;color:var(--accent,#c6a45a);margin-bottom:16px}.hero-logo img{width:100%;height:100%;object-fit:cover;display:block}.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--accent,#c6a45a);margin-bottom:8px}.hero h1{font-family:Georgia,serif;font-size:42px;font-weight:600;letter-spacing:1px;margin:0;color:#fff}.hero p{margin:7px 0 0;color:#f0f0f0;font-size:13px}.updated{display:inline-flex;align-self:flex-start;margin-top:14px;border:1px solid #ffffff55;border-radius:20px;padding:6px 10px;font-size:9px;color:#eee;background:#0005}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:0}.sidebar{padding:28px 22px;border-right:1px solid #dfe4e8;background:var(--surface,#fff)}.brand-title{font-family:Georgia,serif;font-size:20px;letter-spacing:2px;color:var(--accent,#c6a45a);margin-bottom:4px}.brand-sub{font-size:9px;letter-spacing:2px;color:#89919a;text-transform:uppercase;margin-bottom:24px}.about{font-size:11px;line-height:1.7;color:#68717a;border-top:1px solid #e5e8eb;border-bottom:1px solid #e5e8eb;padding:17px 0}.side-title{font-size:9px;letter-spacing:2px;color:var(--accent,#c6a45a);text-transform:uppercase;margin:22px 0 10px}.contact{display:grid;gap:9px;font-size:10px;color:#68717a;line-height:1.45}.wifi{margin-top:18px;padding:11px;border:1px solid #e1e5e8;background:#f7f8f9;font-size:9px;color:#68717a}.main{min-width:0;background:var(--bg,#f5f7fa)}.cat-nav{position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow:auto;padding:12px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #e4e7ea;scrollbar-width:none}.cat-nav::-webkit-scrollbar{display:none}.cat-nav a{flex:none;text-decoration:none;color:#66707a;border:1px solid #dfe3e7;border-radius:999px;padding:8px 13px;font-size:10px;transition:.2s}.cat-nav a:first-child{color:#fff;background:var(--accent,#c6a45a);border-color:var(--accent,#c6a45a)}.menu{padding:10px 26px 40px}.cat{scroll-margin-top:62px;display:flex;align-items:center;gap:10px;margin:24px 0 4px;font-family:Georgia,serif;font-size:21px;font-weight:600;color:var(--text,#17202a)}.cat:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--accent,#c6a45a),transparent)}.cat-count{font:10px Inter,system-ui;color:#89919a}.cat-photo{width:42px;height:32px;border-radius:8px;object-fit:cover;flex:none;border:1px solid #ddd}.dish{display:grid;grid-template-columns:94px minmax(0,1fr) auto;gap:15px;padding:14px 0;border-bottom:1px solid #e2e6e9;align-items:center;cursor:pointer;transition:transform .15s}.dish:hover{transform:translateY(-1px)}.photo{width:94px;height:76px;border-radius:var(--radius,12px);overflow:hidden;background:#e9edf0;display:grid;place-items:center;color:#8b949c;font-size:25px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.name{font-family:Georgia,serif;font-size:15px;font-weight:600;color:var(--text,#17202a);line-height:1.25}.desc{font-size:10px;color:#68717a;line-height:1.45;margin-top:5px}.composition{font-size:9px;color:#89919a;line-height:1.4;margin-top:4px}.price{font-size:14px;font-weight:800;color:var(--text,#17202a);white-space:nowrap;align-self:start;padding-top:2px}.info-block{margin:20px 0;padding:16px;border:1px solid #e1e5e8;background:var(--surface,#fff);border-radius:var(--radius,12px)}.info-block h3{font-family:Georgia,serif;font-size:15px;font-weight:600;color:var(--accent,#c6a45a);margin:0 0 9px}.info-block p{margin:0;color:#68717a;font-size:11px;line-height:1.6}.feedback{margin:8px 0 20px;padding:18px;text-align:center;border:1px solid #e1e5e8;background:var(--surface,#fff);color:#68717a;font-size:10px;border-radius:var(--radius,12px)}.feedback strong{display:block;color:var(--accent,#c6a45a);font-family:Georgia,serif;font-size:15px;margin-bottom:5px}.footer{border-top:1px solid #e1e5e8;padding:18px;text-align:center;color:#89919a;font-size:9px;letter-spacing:1px;background:var(--surface,#fff)}
body[data-menu-theme="dark"] .cat-nav{background:rgba(11,14,14,.94);border-color:#ffffff12}body[data-menu-theme="dark"] .cat-nav a{color:#aaa;border-color:#ffffff1a}body[data-menu-theme="dark"] .sidebar{border-color:#ffffff12}body[data-menu-theme="dark"] .about,body[data-menu-theme="dark"] .dish,body[data-menu-theme="dark"] .footer{border-color:#ffffff12}body[data-menu-theme="dark"] .brand-sub,body[data-menu-theme="dark"] .about,body[data-menu-theme="dark"] .contact,body[data-menu-theme="dark"] .desc,body[data-menu-theme="dark"] .composition{color:#999}body[data-menu-theme="dark"] .photo{background:#151919}body[data-menu-theme="dark"] .info-block,body[data-menu-theme="dark"] .feedback{border-color:#ffffff12;background:var(--surface,#101313)}
.detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(8px)}.detail-overlay.show{display:flex}.detail-card{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--surface,#fff);color:var(--text,#17202a);border-radius:24px;box-shadow:0 25px 80px #0008;position:relative}.detail-close{position:absolute;right:14px;top:14px;width:38px;height:38px;border:0;border-radius:50%;background:#0008;color:#fff;font-size:25px;z-index:3;cursor:pointer}.detail-photo{width:100%;height:min(48vh,360px);background:#e9edf0;overflow:hidden}.detail-photo img{width:100%;height:100%;object-fit:cover;display:block}.detail-body{padding:24px}.detail-body h2{font-family:Georgia,serif;font-size:28px;margin:0 42px 8px 0}.detail-desc{font-size:14px;line-height:1.6;color:#68717a;margin-top:12px}.detail-composition{margin-top:15px;padding:13px;border-radius:13px;background:#f5f7f8;font-size:12px;line-height:1.6;color:#68717a}.detail-price{margin-top:18px;font-size:20px;font-weight:800;color:var(--accent,#c6a45a)}body[data-menu-theme="dark"] .detail-composition{background:#151919;color:#aaa}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{display:none}.hero{min-height:330px}.hero-content{min-height:330px;padding:24px 20px}.hero h1{font-size:34px}.menu{padding:8px 16px 30px}.dish{grid-template-columns:82px minmax(0,1fr) auto;gap:11px}.photo{width:82px;height:68px}.name{font-size:14px}.price{font-size:12px}.cat{font-size:19px}.cat-nav{padding-left:12px;padding-right:12px}.detail-overlay{padding:0}.detail-card{max-height:100vh;height:100%;border-radius:0}.detail-photo{height:42vh}.detail-body{padding:20px}}
@media(min-width:721px){.hero-content{max-width:760px;margin:auto}.hero-logo{width:86px;height:86px}.hero h1{font-size:48px}}
</style>
</head>
<body>
<div class="page">
<header class="hero"><div class="hero-photo" id="heroPhoto"></div><div class="hero-content"><div class="hero-logo" id="heroLogo">A</div><div class="eyebrow">Restaurant &amp; Lounge</div><h1 id="restaurant">Anar Restaurant</h1><p id="tagline">Семейный ресторан</p><span class="updated" id="updated"></span></div></header>
<div class="layout"><aside class="sidebar"><div class="brand-title" id="sideBrand">Anar Restaurant</div><div class="brand-sub">QR DIGITAL MENU</div><div class="about" id="sideAbout">Добро пожаловать в наш ресторан. Здесь собраны актуальные блюда и напитки.</div><div class="side-title">Информация</div><div class="contact" id="sideContact"></div><div class="wifi" id="sideWifi" style="display:none"></div></aside>
<main class="main"><nav class="cat-nav" id="catNav"></nav><section class="menu"><div id="aboutBlock" class="info-block" style="display:none"></div><div id="content"><div class="loading">Загрузка меню…</div></div><div id="feedback" class="feedback" style="display:none"><strong>Спасибо, что вы с нами</strong><span>Ваше мнение помогает нам становиться лучше.</span></div></section><footer class="footer">DIGITAL MENU • <span id="footerName">ANAR RESTAURANT</span></footer></main></div></div>
<div id="detailOverlay" class="detail-overlay" aria-hidden="true"><article class="detail-card"><button class="detail-close" id="detailClose" type="button">×</button><div class="detail-photo" id="detailPhoto">🍽️</div><div class="detail-body"><h2 id="detailName"></h2><div class="detail-desc" id="detailDesc"></div><div class="detail-composition" id="detailComposition" style="display:none"></div><div class="detail-price" id="detailPrice"></div></div></article></div>
<script>
const DEFAULT={name:'Anar Restaurant',tagline:'Семейный ресторан',about:'Добро пожаловать в наш ресторан.',accent:'#c6a45a',text:'#17202a',bg:'#f5f7fa',surface:'#ffffff',theme:'light',font:'Inter',radius:'12px',hero:'',logo:'',phone:'',address:'',hours:'',social:'',wifi:'',showPrices:true,showDescriptions:true,showComposition:true,showAbout:true,showContacts:true};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function setImage(el,src,alt=''){el.textContent='';if(!src)return;const img=document.createElement('img');img.src=src;img.alt=alt;img.loading='eager';img.decoding='async';img.referrerPolicy='no-referrer';img.onerror=()=>{el.textContent='';};el.appendChild(img)}
function applyPublicTheme(d){const root=document.documentElement;const theme=d.theme==='dark'?'dark':'light';root.style.setProperty('--accent',d.accent||DEFAULT.accent);root.style.setProperty('--text',d.text||DEFAULT.text);root.style.setProperty('--bg',d.bg||DEFAULT.bg);root.style.setProperty('--surface',d.surface||DEFAULT.surface);root.style.setProperty('--radius',d.radius||DEFAULT.radius);root.style.setProperty('--font',d.font==='system'?'system-ui':(d.font||'Inter'));document.body.dataset.menuTheme=theme;document.body.style.background=d.bg||DEFAULT.bg;document.getElementById('themeColor').content=d.accent||DEFAULT.accent;const hero=document.querySelector('.hero');if(hero)hero.style.background=d.surface||DEFAULT.surface}
function applyDesign(raw){const d={...DEFAULT,...(raw||{})};applyPublicTheme(d);document.getElementById('restaurant').textContent=d.name||DEFAULT.name;document.getElementById('sideBrand').textContent=d.name||DEFAULT.name;document.getElementById('footerName').textContent=(d.name||DEFAULT.name).toUpperCase();document.getElementById('tagline').textContent=d.tagline||DEFAULT.tagline;const hp=document.getElementById('heroPhoto');setImage(hp,d.hero,'Фото ресторана');hp.classList.toggle('show',!!d.hero);const logo=document.getElementById('heroLogo');if(d.logo)setImage(logo,d.logo,'Логотип ресторана');else logo.textContent=(d.name||'A').slice(0,1);logo.style.borderColor=d.accent||DEFAULT.accent;logo.style.color=d.accent||DEFAULT.accent;document.getElementById('sideAbout').textContent=d.about||DEFAULT.about;const contact=[d.phone&&('Телефон: '+d.phone),d.address&&('Адрес: '+d.address),d.hours&&('Время работы: '+d.hours),d.social&&('Сайт / Instagram: '+d.social)].filter(Boolean);document.getElementById('sideContact').innerHTML=d.showContacts?contact.map(x=>'<div>'+esc(x)+'</div>').join(''):'';const sw=document.getElementById('sideWifi');sw.style.display=d.wifi?'block':'none';sw.textContent=d.wifi?'Wi‑Fi: '+d.wifi:'';const ab=document.getElementById('aboutBlock');ab.style.display=d.showAbout&&d.about?'block':'none';ab.innerHTML=d.showAbout&&d.about?'<h3>О ресторане</h3><p>'+esc(d.about)+'</p>':'';return d}
function dishHtml(x,d){const photo=x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.name)+'" loading="lazy">':'🍽️';const desc=d.showDescriptions&&x.desc?'<div class="desc">'+esc(x.desc)+'</div>':'';const comp=d.showComposition&&x.composition?'<div class="composition">Состав: '+esc(x.composition)+'</div>':'';return '<article class="dish" data-dish-id="'+esc(x.id)+'"><div class="photo">'+photo+'</div><div><div class="name">'+esc(x.name)+'</div>'+desc+comp+'</div>'+(d.showPrices?'<div class="price">'+Number(x.price||0).toFixed(2)+' '+esc(x.currency||'AZN')+'</div>':'')+'</article>'}
let MENU_DATA=null,DESIGN_DATA=null;
function openDish(id){const x=(MENU_DATA?.dishes||[]).find(d=>String(d.id)===String(id));if(!x)return;const d=DESIGN_DATA||DEFAULT;const o=document.getElementById('detailOverlay'),p=document.getElementById('detailPhoto');if(x.photo)setImage(p,x.photo,x.name);else p.textContent='🍽️';document.getElementById('detailName').textContent=x.name||'';document.getElementById('detailDesc').textContent=(d.showDescriptions?x.desc:'')||'';const c=document.getElementById('detailComposition');c.textContent=x.composition?'Состав: '+x.composition:'';c.style.display=d.showComposition&&x.composition?'block':'none';const pr=document.getElementById('detailPrice');pr.textContent=d.showPrices?Number(x.price||0).toFixed(2)+' '+(x.currency||'AZN'):'';o.classList.add('show');o.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeDish(){const o=document.getElementById('detailOverlay');o.classList.remove('show');o.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.getElementById('detailClose').onclick=closeDish;document.getElementById('detailOverlay').addEventListener('click',e=>{if(e.target.id==='detailOverlay')closeDish()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDish()});
async function load(){const id=new URLSearchParams(location.search).get('id');const content=document.getElementById('content');if(!id){content.innerHTML='<div class="error">Ссылка на меню неполная.</div>';return}try{const r=await fetch('/api/qr-menu/public?id='+encodeURIComponent(id),{cache:'no-store'});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.message||'Меню не найдено');DESIGN_DATA=applyDesign(data.design);MENU_DATA=data.menu||{};if(data.updatedAt)document.getElementById('updated').textContent='Обновлено '+new Date(data.updatedAt).toLocaleString('ru-RU');const cats=MENU_DATA.categories||[],dishes=(MENU_DATA.dishes||[]).filter(x=>x.isAvailable!==false);const nav=document.getElementById('catNav');nav.innerHTML=cats.map(c=>'<a href="#cat-'+encodeURIComponent(c.id)+'">'+(c.photo?'<img src="'+esc(c.photo)+'" class="cat-photo" alt="">':'')+esc(c.name)+'</a>').join('');const used=new Set();let html='';for(const c of cats){const list=dishes.filter(x=>String(x.cat)===String(c.id));if(!list.length)continue;used.add(String(c.id));html+='<h2 class="cat" id="cat-'+encodeURIComponent(c.id)+'">'+(c.photo?'<img src="'+esc(c.photo)+'" class="cat-photo" alt="">':'')+'<span>'+esc(c.name)+'</span><span class="cat-count">'+list.length+'</span></h2>'+list.map(x=>dishHtml(x,DESIGN_DATA)).join('')}const uncategorized=dishes.filter(x=>!used.has(String(x.cat)));if(uncategorized.length)html+='<h2 class="cat" id="cat-other"><span>Меню</span><span class="cat-count">'+uncategorized.length+'</span></h2>'+uncategorized.map(x=>dishHtml(x,DESIGN_DATA)).join('');content.innerHTML=html||'<div class="loading">В меню пока нет доступных блюд.</div>';content.querySelectorAll('.dish').forEach(el=>el.addEventListener('click',()=>openDish(el.dataset.dishId)));document.getElementById('feedback').style.display='block'}catch(e){content.innerHTML='<div class="error">Не удалось загрузить меню.<br><br>'+esc(e.message)+'</div>'}}
load();
</script>
</body>
</html>
