<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0b" id="themeColor">
<title>QR Menu</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#050707;color:#eee;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.page{width:min(1120px,100%);margin:auto;min-height:100vh;background:#090b0b}.gold{color:var(--accent,#c6a45a)}button,a{font:inherit}.hero{position:relative;min-height:360px;background:#080909;overflow:hidden}.hero-photo{position:absolute;inset:0;background-position:center;background-size:cover;display:none}.hero-photo.show{display:block}.hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004 0%,#0008 55%,#070909 100%)}.hero-content{position:relative;z-index:2;min-height:360px;padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:flex-end}.hero-logo{width:76px;height:76px;border:1px solid var(--accent,#c6a45a);border-radius:50%;background:#0a0c0c;display:grid;place-items:center;overflow:hidden;font-family:Georgia,serif;font-size:27px;color:var(--accent,#c6a45a);margin-bottom:16px}.hero-logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--accent,#c6a45a);margin-bottom:8px}.hero h1{font-family:Georgia,serif;font-size:42px;font-weight:500;letter-spacing:1px;margin:0;color:#fff}.hero p{margin:7px 0 0;color:#c7c7c7;font-size:13px}.updated{display:inline-flex;align-self:flex-start;margin-top:14px;border:1px solid #ffffff33;border-radius:20px;padding:6px 10px;font-size:9px;color:#aaa;background:#0005}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:0}.sidebar{padding:28px 22px;border-right:1px solid #ffffff14;background:#0b0e0e}.brand-title{font-family:Georgia,serif;font-size:20px;letter-spacing:2px;color:var(--accent,#c6a45a);margin-bottom:4px}.brand-sub{font-size:9px;letter-spacing:2px;color:#777;text-transform:uppercase;margin-bottom:24px}.about{font-size:11px;line-height:1.7;color:#aaa;border-top:1px solid #ffffff12;border-bottom:1px solid #ffffff12;padding:17px 0}.side-title{font-size:9px;letter-spacing:2px;color:var(--accent,#c6a45a);text-transform:uppercase;margin:22px 0 10px}.contact{display:grid;gap:9px;font-size:10px;color:#aaa;line-height:1.45}.wifi{margin-top:18px;padding:11px;border:1px solid #ffffff12;background:#ffffff03;font-size:9px;color:#999}.main{min-width:0;background:#0c0f0f}.cat-nav{position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow:auto;padding:12px 16px;background:#0b0e0eea;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff12;scrollbar-width:none}.cat-nav::-webkit-scrollbar{display:none}.cat-nav a{flex:none;text-decoration:none;color:#aaa;border:1px solid #ffffff1a;border-radius:4px;padding:8px 12px;font-size:10px;transition:.2s}.cat-nav a:first-child{color:#080a0a;background:var(--accent,#c6a45a);border-color:var(--accent,#c6a45a)}.menu{padding:10px 26px 40px}.cat{scroll-margin-top:62px;display:flex;align-items:center;gap:10px;margin:24px 0 4px;font-family:Georgia,serif;font-size:21px;font-weight:500;color:#eee}.cat:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--accent,#c6a45a),transparent)}.cat-count{font:10px Inter,system-ui;color:#666}.dish{display:grid;grid-template-columns:94px minmax(0,1fr) auto;gap:15px;padding:14px 0;border-bottom:1px solid #ffffff0d;align-items:center}.photo{width:94px;height:76px;border-radius:7px;overflow:hidden;background:#151919;display:grid;place-items:center;color:#777;font-size:25px}.photo img{width:100%;height:100%;object-fit:cover;display:block}.name{font-family:Georgia,serif;font-size:15px;color:#f0f0f0;line-height:1.25}.desc{font-size:10px;color:#858b89;line-height:1.45;margin-top:5px}.composition{font-size:9px;color:#666;line-height:1.4;margin-top:4px}.price{font-size:14px;font-weight:700;color:var(--accent,#c6a45a);white-space:nowrap;align-self:start;padding-top:2px}.info-block{margin:20px 0;padding:16px;border:1px solid #ffffff12;background:#101313;border-radius:6px}.info-block h3{font-family:Georgia,serif;font-size:15px;font-weight:500;color:var(--accent,#c6a45a);margin:0 0 9px}.info-block p{margin:0;color:#999;font-size:11px;line-height:1.6}.feedback{margin:8px 0 20px;padding:18px;text-align:center;border:1px solid #ffffff12;background:linear-gradient(135deg,#101313,#0a0c0c);color:#999;font-size:10px}.feedback strong{display:block;color:var(--accent,#c6a45a);font-family:Georgia,serif;font-size:15px;margin-bottom:5px}.footer{border-top:1px solid #ffffff10;padding:18px;text-align:center;color:#555;font-size:9px;letter-spacing:1px}.loading,.error{padding:70px 20px;text-align:center;color:#777}.error{color:#c77b7b}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{display:none}.hero{min-height:330px}.hero-content{min-height:330px;padding:24px 20px}.hero h1{font-size:34px}.menu{padding:8px 16px 30px}.dish{grid-template-columns:82px minmax(0,1fr) auto;gap:11px}.photo{width:82px;height:68px}.name{font-size:14px}.price{font-size:12px}.cat{font-size:19px}.cat-nav{padding-left:12px;padding-right:12px}}@media(min-width:721px){.hero-content{max-width:760px;margin:auto}.hero-logo{width:86px;height:86px}.hero h1{font-size:48px}}
</style>
</head>
<body>
<div class="page">
<header class="hero"><div class="hero-photo" id="heroPhoto"></div><div class="hero-content"><div class="hero-logo" id="heroLogo">A</div><div class="eyebrow">Restaurant &amp; Lounge</div><h1 id="restaurant">Anar Restaurant</h1><p id="tagline">Семейный ресторан</p><span class="updated" id="updated"></span></div></header>
<div class="layout">
<aside class="sidebar">
<div class="brand-title" id="sideBrand">Anar Restaurant</div><div class="brand-sub">QR DIGITAL MENU</div>
<div class="about" id="sideAbout">Добро пожаловать в наш ресторан. Здесь собраны актуальные блюда и напитки.</div>
<div class="side-title">Информация</div><div class="contact" id="sideContact"></div>
<div class="wifi" id="sideWifi" style="display:none"></div>
</aside>
<main class="main">
<nav class="cat-nav" id="catNav"></nav>
<section class="menu">
<div id="aboutBlock" class="info-block" style="display:none"></div>
<div id="content"><div class="loading">Загрузка меню…</div></div>
<div id="feedback" class="feedback" style="display:none"><strong>Спасибо, что вы с нами</strong><span>Ваше мнение помогает нам становиться лучше.</span></div>
</section>
<footer class="footer">DIGITAL MENU • <span id="footerName">ANAR RESTAURANT</span></footer>
</main>
</div>
</div>
<script>
const DEFAULT={name:'Anar Restaurant',tagline:'Семейный ресторан',about:'Добро пожаловать в наш ресторан.',accent:'#c6a45a',text:'#f0f0f0',bg:'#050707',surface:'#0c0f0f',theme:'dark',font:'Inter',radius:'8px',hero:'',logo:'',phone:'',address:'',hours:'',social:'',wifi:'',showPrices:true,showDescriptions:true,showComposition:true,showAbout:true,showContacts:true};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function applyDesign(raw){const d={...DEFAULT,...(raw||{})};const root=document.documentElement;root.style.setProperty('--accent',d.accent||DEFAULT.accent);root.style.setProperty('--text',d.text||DEFAULT.text);root.style.setProperty('--bg',d.bg||DEFAULT.bg);root.style.setProperty('--surface',d.surface||DEFAULT.surface);root.style.setProperty('--radius',d.radius||DEFAULT.radius);root.style.setProperty('--font',d.font==='system'?'system-ui':(d.font||'Inter'));document.body.style.background=d.bg||DEFAULT.bg;document.getElementById('themeColor').content=d.accent||DEFAULT.accent;document.getElementById('restaurant').textContent=d.name||DEFAULT.name;document.getElementById('sideBrand').textContent=d.name||DEFAULT.name;document.getElementById('footerName').textContent=(d.name||DEFAULT.name).toUpperCase();document.getElementById('tagline').textContent=d.tagline||DEFAULT.tagline;const hp=document.getElementById('heroPhoto');hp.style.backgroundImage=d.hero?'url("'+String(d.hero).replace(/"/g,'&quot;')+'")':'';hp.classList.toggle('show',!!d.hero);const logo=document.getElementById('heroLogo');logo.innerHTML=d.logo?'<img src="'+esc(d.logo)+'" alt="logo">':esc((d.name||'A').slice(0,1));logo.style.borderColor=d.accent||DEFAULT.accent;logo.style.color=d.accent||DEFAULT.accent;document.getElementById('sideAbout').textContent=d.about||DEFAULT.about;const contact=[d.phone&&('Телефон: '+d.phone),d.address&&('Адрес: '+d.address),d.hours&&('Время работы: '+d.hours),d.social&&('Сайт / Instagram: '+d.social)].filter(Boolean);document.getElementById('sideContact').innerHTML=contact.map(x=>'<div>'+esc(x)+'</div>').join('');const sw=document.getElementById('sideWifi');sw.style.display=d.wifi?'block':'none';sw.textContent=d.wifi?'Wi‑Fi: '+d.wifi:'';const ab=document.getElementById('aboutBlock');ab.style.display=d.showAbout&&d.about?'block':'none';ab.innerHTML=d.showAbout&&d.about?'<h3>О ресторане</h3><p>'+esc(d.about)+'</p>':'';return d;}
function dishHtml(x,d){const photo=x.photo?'<img src="'+esc(x.photo)+'" alt="'+esc(x.name)+'" loading="lazy">':'🍽️';const desc=d.showDescriptions&&x.desc?'<div class="desc">'+esc(x.desc)+'</div>':'';const comp=d.showComposition&&x.composition&&x.composition!==x.desc?'<div class="composition">Состав: '+esc(x.composition)+'</div>':'';return '<article class="dish"><div class="photo">'+photo+'</div><div><div class="name">'+esc(x.name)+'</div>'+desc+comp+'</div>'+(d.showPrices?'<div class="price">'+Number(x.price||0).toFixed(2)+' '+esc(x.currency||'AZN')+'</div>':'')+'</article>';}
async function load(){const id=new URLSearchParams(location.search).get('id');const content=document.getElementById('content');if(!id){content.innerHTML='<div class="error">Ссылка на меню неполная.</div>';return;}try{const r=await fetch('/api/qr-menu/public?id='+encodeURIComponent(id),{cache:'no-store'});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.message||'Меню не найдено');const d=applyDesign(data.design);if(data.updatedAt)document.getElementById('updated').textContent='Обновлено '+new Date(data.updatedAt).toLocaleString('ru-RU');const cats=data.menu?.categories||[],dishes=(data.menu?.dishes||[]).filter(x=>x.isAvailable!==false);const nav=document.getElementById('catNav');nav.innerHTML=cats.map(c=>'<a href="#cat-'+encodeURIComponent(c.id)+'">'+esc(c.name)+'</a>').join('');const used=new Set();let html='';for(const c of cats){const list=dishes.filter(x=>String(x.cat)===String(c.id));if(!list.length)continue;used.add(String(c.id));html+='<h2 class="cat" id="cat-'+encodeURIComponent(c.id)+'"><span>'+esc(c.name)+'</span><span class="cat-count">'+list.length+'</span></h2>'+list.map(x=>dishHtml(x,d)).join('');}const uncategorized=dishes.filter(x=>!used.has(String(x.cat)));if(uncategorized.length)html+='<h2 class="cat" id="cat-other"><span>Меню</span><span class="cat-count">'+uncategorized.length+'</span></h2>'+uncategorized.map(x=>dishHtml(x,d)).join('');content.innerHTML=html||'<div class="loading">В меню пока нет доступных блюд.</div>';document.getElementById('feedback').style.display='block';}catch(e){content.innerHTML='<div class="error">Не удалось загрузить меню.<br><br>'+esc(e.message)+'</div>';}}
load();
</script>
</body>
</html>
