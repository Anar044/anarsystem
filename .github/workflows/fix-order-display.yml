name: Fix order display fields

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-order-display.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch plugin-orders.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugin-orders.js')
          s = p.read_text()
          old = 'function keyOf(row,names){const entries=Object.entries(row||{});for(const name of names){const hit=entries.find(([key])=>key.toLowerCase()===name.toLowerCase());if(hit&&hit[1]!==null&&hit[1]!==undefined&&hit[1]!=="")return hit[1];}return null;}'
          new = '''function keyOf(row,names){\n    const wanted=names.map(name=>String(name).toLowerCase());\n    function walk(value,depth){\n      if(value===null||value===undefined||typeof value!=="object"||depth>12)return null;\n      if(Array.isArray(value)){\n        for(const item of value){const found=walk(item,depth+1);if(found!==null&&found!==undefined&&found!=="")return found;}\n        return null;\n      }\n      const entries=Object.entries(value);\n      for(const [key,val] of entries){\n        if(wanted.includes(String(key).toLowerCase())&&val!==null&&val!==undefined&&val!=="")return val;\n      }\n      for(const [,child] of entries){\n        const found=walk(child,depth+1);\n        if(found!==null&&found!==undefined&&found!=="")return found;\n      }\n      return null;\n    }\n    return walk(row,0);\n  }'''
          if old not in s:
              raise SystemExit('old keyOf not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-orders.js
          git commit -m "Fix nested order fields display" || true
          git rm .github/workflows/fix-order-display.yml
          git commit -m "Remove temporary order display workflow"
          git push