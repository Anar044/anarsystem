name: Rename P&L trading revenue line

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: github.event.head_commit.message != 'Rename P&L trading revenue line'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename exact P&L row
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/api/iiko/pnl.js')
          s = p.read_text(encoding='utf-8')
          old = "{name:'Торговая выручка',value:tradingRevenue,kind:'sub'}"
          new = "{name:'Торговая выручка без учета скидок',value:tradingRevenue,kind:'sub'}"
          if old not in s:
              raise SystemExit('Target P&L row not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/iiko/pnl.js
          git commit -m 'Rename P&L trading revenue line'
          git push
