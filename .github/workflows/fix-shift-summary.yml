name: Fix shift summary calculation
on:
  push:
    paths:
      - '.github/workflows/fix-shift-summary.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace shift summary script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('plugin-control.html')
          s = p.read_text()
          pattern = r'<script>\n\(\(\) => \{\n  const closedEl=document\.getElementById\("shift-closed-sum"\).*?\n\}\)\(\);\n</script>'
          replacement = '''<script>
(() => {
  const closedEl = document.getElementById("shift-closed-sum");
  const openEl = document.getElementById("shift-open-sum");
  const expectedEl = document.getElementById("shift-expected-sum");
  const statusEl = document.getElementById("shift-summary-status");
  if (!closedEl || !openEl || !expectedEl) return;

  const money = value => Number(value || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 });

  function parseMoney(value) {
    if (value == null) return NaN;
    const normalized = String(value)
      .replace(/\\s/g, "")
      .replace(/[^0-9,.-]/g, "")
      .replace(/,(?=.*[,])/g, "")
      .replace(",", ".");
    const number = Number(normalized);
    return Number.isFinite(number) ? number : NaN;
  }

  function calculateFromOrderTable() {
    const rows = Array.from(document.querySelectorAll("#orders-table-body tr"));
    if (!rows.length) return false;

    let closed = 0;
    let open = 0;
    let closedCount = 0;
    let openCount = 0;

    for (const row of rows) {
      const state = row.dataset.orderState || "";
      const cells = row.querySelectorAll("td");
      if (cells.length < 7) continue;
      const amount = parseMoney(cells[6].textContent);
      if (!Number.isFinite(amount)) continue;

      if (state === "closed") {
        closed += amount;
        closedCount++;
      } else if (state === "open") {
        open += amount;
        openCount++;
      }
    }

    closedEl.textContent = money(closed);
    openEl.textContent = money(open);
    expectedEl.textContent = money(closed + open);
    statusEl.textContent = `По списку заказов · ${closedCount} закрытых / ${openCount} открытых`;
    return true;
  }

  function update() {
    if (!calculateFromOrderTable()) {
      statusEl.textContent = "Ожидаем список заказов…";
    }
  }

  update();
  const observer = new MutationObserver(update);
  const target = document.getElementById("result-summary");
  if (target) observer.observe(target, { childList: true, subtree: true });
  setInterval(update, 10000);
})();
</script>'''
          new_s, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('shift summary script not found')
          p.write_text(new_s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-control.html
          git commit -m "Calculate shift revenue from order list"
          git push
