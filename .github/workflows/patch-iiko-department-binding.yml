name: Patch iiko Department binding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply minimal Department ID changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 occurrence, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # 1) cash.js: ownership binding is Department ID only.
          replace_once(
              'cash.js',
              "const state = { plugins: [], pluginId: '', orders: [], filter: 'all', search: '', busy: false, timer: null, detailCache: new Map(), paymentLoading: new Set(), iikoBinding: { departmentIds: [], serverUrl: '' } };",
              "const state = { plugins: [], pluginId: '', orders: [], filter: 'all', search: '', busy: false, timer: null, detailCache: new Map(), paymentLoading: new Set(), iikoBinding: { departmentIds: [] } };"
          )

          replace_once(
              'cash.js',
              '''  function loadIikoBinding(){
            const identity=readJsonStorage('iikoDepartmentIdentity')||{};
            const connection=readJsonStorage('iikoConnection')||{};
            const departments=Array.isArray(identity.departmentIds)&&identity.departmentIds.length?identity.departmentIds:(Array.isArray(connection.departmentIds)?connection.departmentIds:[]);
            const server=identity.server||connection.server||{};
            const ip=String(server.ip||connection.ip||'').trim();
            const port=String(server.port||connection.port||'').trim();
            state.iikoBinding={
              departmentIds:[...new Set(departments.map(String).map(x=>x.trim()).filter(Boolean))],
              serverUrl:ip&&port?`http://${ip}:${port}`:''
            };
            return state.iikoBinding;
          }
''',
              '''  function loadIikoBinding(){
            const identity=readJsonStorage('iikoDepartmentIdentity')||{};
            const connection=readJsonStorage('iikoConnection')||{};
            const departments=Array.isArray(identity.departmentIds)&&identity.departmentIds.length?identity.departmentIds:(Array.isArray(connection.departmentIds)?connection.departmentIds:[]);
            state.iikoBinding={
              departmentIds:[...new Set(departments.map(String).map(x=>x.trim()).filter(Boolean))]
            };
            return state.iikoBinding;
          }
'''
          )

          replace_once(
              'cash.js',
              '''  function bindingQuery(){
            loadIikoBinding();
            const q=new URLSearchParams();
            if(state.iikoBinding.departmentIds.length)q.set('departmentIds',state.iikoBinding.departmentIds.join(','));
            if(state.iikoBinding.serverUrl)q.set('serverUrl',state.iikoBinding.serverUrl);
            return q.toString();
          }
''',
              '''  function bindingQuery(){
            loadIikoBinding();
            const q=new URLSearchParams();
            if(state.iikoBinding.departmentIds.length)q.set('departmentIds',state.iikoBinding.departmentIds.join(','));
            return q.toString();
          }
'''
          )

          replace_once(
              'cash.js',
              '''  function bindingBody(){
            loadIikoBinding();
            return {
              ...(state.iikoBinding.departmentIds.length?{departmentIds:state.iikoBinding.departmentIds}:{}),
              ...(state.iikoBinding.serverUrl?{serverUrl:state.iikoBinding.serverUrl}: {})
            };
          }
''',
              '''  function bindingBody(){
            loadIikoBinding();
            return {
              ...(state.iikoBinding.departmentIds.length?{departmentIds:state.iikoBinding.departmentIds}: {})
            };
          }
'''
          )

          # 2) reports.html and cash.html: load the existing account-sync layer so
          #    iikoConnection/iikoDepartmentIdentity are restored from D1 for the user.
          replace_once(
              'reports.html',
              '<script src="auth.js"></script>\n<script src="app-shell.js"></script>',
              '<script src="auth.js"></script>\n<script src="account-sync.js?v=20260910-1"></script>\n<script src="app-shell.js"></script>'
          )
          replace_once(
              'cash.html',
              '<script src="auth.js"></script><script src="app-shell.js"></script>',
              '<script src="auth.js"></script><script src="account-sync.js?v=20260910-1"></script><script src="app-shell.js"></script>'
          )

          print('Frontend patch applied.')
          PY

      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cash.js reports.html cash.html .github/workflows/patch-iiko-department-binding.yml
          git rm .github/workflows/patch-iiko-department-binding.yml
          git commit -m "fix: bind cash plugin by Department ID" || exit 0
          git push
