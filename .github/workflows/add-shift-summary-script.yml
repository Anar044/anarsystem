name: Add independent shift summary
on: push
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugin-control.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="plugin-control.js"></script>'
          tag = '<script src="shift-summary.js"></script>'
          if tag not in s:
              s = s.replace(marker, marker + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugin-control.html
          git diff --cached --quiet || git commit -m 'Use independent shift summary data'
          git push
