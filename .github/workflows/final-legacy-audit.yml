name: Final Legacy Audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Find remaining legacy references
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            iiko-d1-bridge.js
            iiko-unified-bridge.js
            accounts.css
            cash-shifts.css
            dashboard-style-loader.js
            sidebar-finance-fix.js
            pnl-nav-loader.js
            cash-shifts-nav.js
            finance-nav.js
          )
          for file in "${candidates[@]}"; do
            echo "===== $file ====="
            grep -RFn \
              --exclude="$file" \
              --exclude='final-legacy-audit.yml' \
              --exclude-dir=.git \
              --exclude-dir=node_modules \
              --exclude-dir=mobile \
              -- "$file" . || true
          done
          echo '===== root JS/CSS/HTML inventory ====='
          find . -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' \) -printf '%f\n' | sort
