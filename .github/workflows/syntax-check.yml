name: Syntax Check

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.js' \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './mobile/*' \
            | sort)
          echo "Checked $count JavaScript files"

      - name: Check local AI Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile services/local-document-ai/app/main.py
          echo 'Local AI Python syntax passed'

      - name: Verify public iiko state hides password
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { publicState, SERVER_PASSWORD_MARKER } from './functions/api/iiko/_lib/user-state.js';
          const secret = 'ci-real-iiko-password';
          const safe = publicState({
            connection: { ip: '127.0.0.1', port: '8080', login: 'user', password: secret },
            identity: { organizationId: 'test' }
          });
          const encoded = JSON.stringify(safe);
          if (encoded.includes(secret)) throw new Error('publicState leaked the real iiko password');
          if (safe.connection.password !== SERVER_PASSWORD_MARKER) throw new Error('publicState did not return the server marker');
          if (safe.connection.passwordStored !== true) throw new Error('publicState did not expose passwordStored=true');
          console.log('iiko public state credential test passed');
          NODE

      - name: Verify OLAP Reports has no global transport or DOM patches
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'Storage\.prototype|window\.fetch\s*=|document\.addEventListener\s*=' reports-context.js reports-default-filters.js reports-loader.js; then
            echo 'OLAP Reports reintroduced a global browser monkey patch'
            exit 1
          fi
          if grep -q 'reports-fields-clean.js' reports.html; then
            echo 'Legacy reports-fields-clean.js is active again'
            exit 1
          fi
          if grep -q '<script src="reports.js' reports.html; then
            echo 'reports.js must be loaded only by reports-loader.js'
            exit 1
          fi
          grep -q 'reports-loader.js' reports.html
          echo 'OLAP Reports bootstrap cleanup check passed'

      - name: Verify OLAP result tree UI
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-olap-collapse-all' reports-result.js
          grep -q 'data-olap-expand-all' reports-result.js
          grep -q 'olapTreeId' reports-result.js
          grep -q 'olapAncestors' reports-result.js
          grep -q 'applyTreeVisibility' reports-result.js
          grep -q 'olapPresentationObserved' reports-result.js
          grep -q 'olap-measure-cell' reports.js
          grep -q 'reports-result.js?v=20261002-tree-3' reports-loader.js
          grep -q 'reports-result.css?v=20261002-2' reports.html
          if grep -q 'td:nth-last-child(-n+2){text-align:right' reports-result.css; then
            echo 'OLAP result must align only actual measure columns'
            exit 1
          fi
          echo 'OLAP result tree UI contract passed'

      - name: Verify OLAP endpoint uses shared client
        shell: bash
        run: |
          set -euo pipefail
          file=functions/api/iiko/olap.js
          grep -q './_lib/iiko-client.js' "$file"
          grep -q 'getOlapFields' "$file"
          grep -q 'iikoJson' "$file"
          if grep -Eq '/resto/api/auth|async function authenticate\(|async function sha1\(' "$file"; then
            echo 'OLAP endpoint reintroduced manual iiko authentication'
            exit 1
          fi
          grep -q 'rawResponse' "$file"
          grep -q 'groupByRowFields' "$file"
          grep -q 'groupByColFields' "$file"
          grep -q 'aggregateFields' "$file"
          echo 'OLAP shared client contract check passed'

      - name: Verify P&L uses direct iiko context
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'pnl-d1-loader\.js|iiko-unified-bridge\.js' pnl.html; then
            echo 'P&L legacy bridge is active again'
            exit 1
          fi
          if grep -Eq 'localStorage|getItem\(['"'"']iikoConnection|Storage\.prototype' pnl.js; then
            echo 'P&L reintroduced browser-side iiko connection storage'
            exit 1
          fi
          grep -q 'SH_IikoContext.getBinding' pnl.js
          grep -q 'departmentIds' pnl.js
          grep -q '/api/assets' pnl.js
          grep -q 'Амортизация основных средств' pnl.js
          echo 'P&L direct context and depreciation check passed'

      - name: Verify fixed assets module uses authenticated D1 API
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'getUser' functions/api/assets.js
          grep -q 'fixed_assets' functions/api/assets.js
          grep -q 'fixed_asset_events' functions/api/assets.js
          grep -q "action==='depreciation'" functions/api/assets.js
          grep -q 'Authorization' assets.js
          grep -q 'SH_IikoContext.getBinding' assets.js
          grep -q 'fixed_asset_meta' functions/api/asset-meta.js
          grep -q 'repairCost12m' assets-advanced.js
          grep -q 'ASSET_FILES' functions/api/asset-files.js
          grep -q 'fixed_asset_files' functions/api/asset-files.js
          grep -q 'assets-advanced.js' assets.html
          grep -q '/assets-plan/assets.html' assets.html
          grep -q '/api/asset-meta' assets-plan.js
          grep -q '/api/assets' assets-plan.js
          if grep -Eq '/resto/api/|iikoFetch|getIikoAuth' functions/api/assets.js functions/api/asset-meta.js functions/api/asset-files.js; then
            echo 'Fixed assets module must not call iiko Server'
            exit 1
          fi
          echo 'Fixed assets D1, R2 and planning contract check passed'

      - name: Verify QR Menu uses safe context adapter
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'iiko-unified-bridge\.js|qr-menu-d1-fix\.js' qr-menu.html; then
            echo 'QR Menu legacy bridge is active again'
            exit 1
          fi
          grep -q 'qr-menu-context.js' qr-menu.html
          if grep -En 'Storage\.prototype|window\.fetch\s*=|document\.addEventListener\s*=' qr-menu-context.js; then
            echo 'QR Menu context adapter contains a global monkey patch'
            exit 1
          fi
          grep -q 'SH_IikoContext.get' qr-menu-context.js
          echo 'QR Menu safe context adapter check passed'

      - name: Verify canonical sidebar navigation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-unified-nav-item="menu-engineering.html"' app-shell.js
          grep -q 'data-unified-nav-item="waiter-performance.html"' app-shell.js
          grep -q 'class="documents-nav-group hr-nav-group"' app-shell.js
          grep -q 'data-unified-nav-item="hr-employees.html"' app-shell.js
          grep -q "return'menu-engineering.html'" app-shell.js
          grep -q "return'waiter-performance.html'" app-shell.js
          grep -q "return'hr-employees.html'" app-shell.js
          echo 'Canonical sidebar navigation contract passed'

      - name: Verify unified bridge HTML allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t refs < <(grep -Rl --include='*.html' 'iiko-unified-bridge.js' . | sed 's#^\./##' | sort || true)
          echo 'HTML references to iiko-unified-bridge.js:'
          printf '  %s\n' "${refs[@]:-<none>}"
          unexpected=0
          for file in "${refs[@]}"; do
            case "$file" in
              index.html) ;; # inactive on Cloudflare: _redirects rewrites it to dashboard.html
              *) echo "Unexpected unified bridge reference: $file"; unexpected=1 ;;
            esac
          done
          test "$unexpected" = "0"
          grep -q '^/index.html /dashboard.html 200$' _redirects
          echo 'Unified bridge allowlist check passed'

      - name: Verify document routes use shared iiko authentication
        shell: bash
        run: |
          set -euo pipefail
          files=(
            functions/api/iiko/connect.js
            functions/api/iiko/incoming-invoices.js
            functions/api/iiko/outgoing-invoices.js
            functions/api/iiko/references.js
          )
          for file in "${files[@]}"; do
            if grep -Eq '/resto/api/auth|async function auth\(' "$file"; then
              echo "Manual iiko authentication reintroduced in $file"
              exit 1
            fi
            grep -q './_lib/iiko-client.js' "$file"
          done
          grep -q 'getIikoAuth' functions/api/iiko/incoming-invoices.js
          grep -q 'getIikoAuth' functions/api/iiko/outgoing-invoices.js
          grep -q 'getIikoAuth' functions/api/iiko/references.js
          grep -q 'iikoText' functions/api/iiko/connect.js
          echo 'Shared iiko authentication check passed'

      - name: Verify AI assistant safety contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'getUser' functions/api/ai-assistant.js
          grep -q 'loadPrivateIikoState' functions/api/ai-assistant.js
          grep -q 'OPENAI_API_KEY' functions/api/ai-assistant.js
          grep -q 'assistantToolDefinitions' functions/api/ai-assistant.js
          grep -q 'readOnly: true' functions/api/ai-assistant.js
          grep -q 'analyze_purchase_prices' functions/api/iiko/_lib/ai-assistant-tools.js
          grep -q 'get_supplier_balances' functions/api/iiko/_lib/ai-assistant-tools.js
          grep -q 'run_olap_report' functions/api/iiko/_lib/ai-assistant-tools.js
          grep -q 'ai-assistant.html' app-shell.js
          grep -q 'getUser' functions/api/ai-assistant-transcribe.js
          grep -q '/v1/audio/transcriptions' functions/api/ai-assistant-transcribe.js
          grep -q 'getUser' functions/api/ai-assistant-speech.js
          grep -q '/v1/audio/speech' functions/api/ai-assistant-speech.js
          if grep -Eq 'OPENAI_API_KEY\s*=|sk-[A-Za-z0-9_-]+' ai-assistant.js ai-assistant.html; then
            echo 'AI assistant frontend must not contain OpenAI credentials'
            exit 1
          fi
          echo 'AI assistant read-only/authenticated contract passed'

      - name: Verify Payroll partial-month and overtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MONTHLY_PAYROLL_V2_PARTIAL_OVERTIME" functions/api/hr/payroll.js
          grep -q "factualBaseGross" functions/api/hr/payroll.js
          grep -q "officialAccruedGross" functions/api/hr/payroll.js
          grep -q "extraDayEquivalent" functions/api/hr/payroll.js
          grep -q "extraDayPay" functions/api/hr/payroll.js
          grep -q "overtimePayableMinutes" functions/api/hr/payroll.js
          grep -q "regularPayable" hr-payroll.js
          grep -q "Отдельная выплата" hr-payroll.js
          echo 'Payroll partial-month and overtime contract passed'

      - name: Verify manual overtime workflow without Face ID
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function faceIdConnected" hr-timesheet.js
          grep -q "Ручной режим:" hr-timesheet.js
          grep -q "overtimeReset" functions/api/hr/timesheet-adjustments.js
          grep -q "FACTUAL_CORRECTION_CHANGED" functions/api/hr/timesheet-adjustments.js
          grep -q "FACTUAL_CORRECTION_DELETED" functions/api/hr/timesheet-adjustments.js
          grep -q "Открыть табель и создать тестовый факт" hr-payroll.js
          echo 'Manual overtime workflow contract passed'

      - name: Verify Payroll overtime settlement ledger contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "hr_overtime_payroll_accruals" functions/api/hr/payroll.js
          grep -q "hr_overtime_payments" functions/api/hr/overtime-settlements.js
          grep -q "RECORD_PAYMENT" functions/api/hr/overtime-settlements.js
          grep -q "CANCEL_PAYMENT" functions/api/hr/overtime-settlements.js
          grep -q "closingDebt" functions/api/hr/overtime-settlements.js
          grep -q "renderSettlements" hr-payroll.js
          grep -q "Реестр доплат за дополнительные часы" hr-payroll.html
          grep -q 'data-mode="SETTLEMENTS"' hr-payroll.html
          grep -q "hrpSettlementCard" hr-payroll.js
          grep -q "settlement-mode" hr-payroll-v3.css
          echo 'Payroll overtime settlement ledger contract passed'

      - name: Verify Payroll accounting journal contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "hr_payroll_accounting_config" functions/api/hr/_lib/payroll-accounting.js
          grep -q "hr_payroll_bank_accounts" functions/api/hr/_lib/payroll-accounting.js
          grep -q "getPayrollBankAccounts" functions/api/hr/payroll-accounting-settings.js
          grep -q "hr_overtime_payment_sources" functions/api/hr/overtime-settlements.js
          grep -q "bankAccountId" functions/api/hr/overtime-settlements.js
          grep -q "hrpPaymentBankAccount" hr-payroll.html
          grep -q "hrpaBankList" hr-payroll-accounting.html
          grep -q "bankAccounts:state.bankAccounts" hr-payroll-accounting.js
          grep -q "sh_accounting_journal" functions/api/hr/_lib/payroll-accounting.js
          grep -q "syncOvertimeAccrualPosting" functions/api/hr/payroll.js
          grep -q "syncOvertimePaymentPosting" functions/api/hr/overtime-settlements.js
          grep -q "listAccountingJournal" functions/api/iiko/pnl.js
          grep -q "listAccountingJournal" functions/api/iiko/accounts.js
          grep -q "listAccountingJournal" functions/api/iiko/account-postings.js
          grep -q "Бухгалтерия Payroll" hr-payroll.html
          grep -q "Счета бухгалтерии Payroll" hr-payroll-accounting.html
          grep -q "hrpa-critical-styles" app-shell.js
          echo 'Payroll accounting journal contract passed'

      - name: Verify SenseFace 2A ADMS contract
        shell: bash
        run: |
          set -euo pipefail
          test -f functions/api/hr/_lib/zkteco-adms.js
          test -f functions/iclock/cdata.js
          test -f functions/iclock/cdata.aspx.js
          test -f functions/iclock/getrequest.js
          test -f functions/iclock/getrequest.aspx.js
          test -f functions/iclock/registry.js
          test -f functions/iclock/push.js
          test -f functions/iclock/querydata.js
          grep -q "hr_zkteco_adms_devices" functions/api/hr/_lib/zkteco-adms.js
          grep -q "hr_zkteco_adms_raw" functions/api/hr/_lib/zkteco-adms.js
          grep -q "ATTLOGStamp=0" functions/api/hr/_lib/zkteco-adms.js
          grep -q "Realtime=1" functions/api/hr/_lib/zkteco-adms.js
          grep -q "TransTables=User Transaction" functions/api/hr/_lib/zkteco-adms.js
          grep -q "tablename=transaction" functions/api/hr/timeclock.js
          grep -q "registerAdmsDevice" functions/api/hr/timeclock.js
          grep -q "ADMS_PUSH" hr-timeclock.js
          grep -q "RAW ADMS" hr-timeclock.html
          echo 'SenseFace ADMS contract passed'

      - name: Verify Payroll styles survive app shell cleanup
        shell: bash
        run: |
          set -euo pipefail
          grep -q "hr-payroll-v3.css" app-shell.js
          grep -q "hrp-critical-styles" app-shell.js
          grep -q "p.includes('hr-payroll')" hr-light-theme.js
          grep -q "hr-payroll-v3.css" hr-payroll.html
          echo 'Payroll style preservation contract passed'

      - name: Verify iiko authentication is centralized
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manual < <(grep -Rl --include='*.js' '/resto/api/auth' functions/api/iiko | sort || true)
          echo 'Files containing /resto/api/auth:'
          printf '  %s\n' "${manual[@]:-<none>}"
          test "${#manual[@]}" -eq 1
          test "${manual[0]}" = 'functions/api/iiko/_lib/iiko-client.js'
          echo 'iiko authentication is centralized in the shared client'

  preview-smoke:
    if: github.event_name == 'pull_request'
    needs: javascript
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Cloudflare Pages preview URL
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF//\//-}"
          branch="${branch:0:28}"
          echo "PREVIEW_BASE=https://${branch}.smarthoreca.pages.dev" >> "$GITHUB_ENV"
          echo "Preview URL: https://${branch}.smarthoreca.pages.dev"

      - name: Wait for current Cloudflare Pages preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            home_code=$(curl -sS -L -o /tmp/preview-home.html -w '%{http_code}' "$PREVIEW_BASE/" || true)
            state_code=$(curl -sS -o /tmp/preview-state.json -w '%{http_code}' "$PREVIEW_BASE/api/iiko/state" || true)
            echo "Preview probe: home=$home_code state=$state_code attempt=$attempt"
            if [ "$home_code" = "200" ] && [ "$state_code" = "401" ]; then
              echo "Current preview ready: $PREVIEW_BASE"
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare Pages preview did not reach the expected current version"
          cat /tmp/preview-state.json || true
          exit 1

      - name: Smoke test application pages
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            "/"
            "/dashboard.html"
            "/reports.html"
            "/abc-xyz.html"
            "/pnl.html"
            "/finance.html"
            "/supplier-balances.html"
            "/cash-shifts.html"
            "/settings.html"
            "/qr-menu.html"
            "/assets.html"
            "/assets-plan/assets.html"
            "/stock-balances.html"
            "/stock-movements.html"
            "/food-cost.html"
            "/labor-cost.html"
            "/nakladnye.html"
            "/ai-documents.html"
            "/ai-assistant.html"
            "/hr-payroll.html"
            "/hr-payroll-accounting.html"
            "/hr-payroll-v3.css"
            "/hr-compensation.html"
            "/hr-payroll-adjustments.html"
            "/hr-timeclock.html"
            "/rashodnye-nakladnye.html"
            "/akty-spisaniya.html"
          )
          for path in "${pages[@]}"; do
            code=$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "$PREVIEW_BASE$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done

      - name: Smoke test changed iiko API routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            "/api/iiko/dashboard"
            "/api/iiko/dashboard-summary"
            "/api/iiko/pnl"
            "/api/iiko/abc"
            "/api/iiko/finance-data"
            "/api/iiko/cash-shifts"
            "/api/iiko/cash-shift-detail"
            "/api/iiko/nomenclature"
            "/api/iiko/stock-balances"
            "/api/iiko/stock-movements"
            "/api/iiko/food-cost"
            "/api/iiko/qr-menu"
            "/api/iiko/qr-image"
            "/api/iiko/accounts"
            "/api/iiko/supplier-balances"
            "/api/iiko/contractors"
            "/api/iiko/chain"
            "/api/iiko/connect"
            "/api/iiko/debug"
            "/api/iiko/events"
            "/api/iiko/olap"
            "/api/iiko/orders"
            "/api/iiko/sales"
            "/api/iiko/incoming-invoices"
            "/api/iiko/outgoing-invoices"
            "/api/iiko/references"
            "/api/iiko/invoice-reference-data"
            "/api/ai-documents"
            "/api/ai-assistant"
            "/api/ai-assistant-transcribe"
            "/api/ai-assistant-speech"
            "/api/iiko/documents"
            "/api/iiko/document-action"
            "/api/iiko/document-by-number"
            "/api/iiko/state"
            "/api/assets"
            "/api/asset-meta"
            "/api/asset-files"
            "/api/hr/payroll"
            "/api/hr/payroll-adjustments"
            "/api/hr/payroll-accounting-settings"
            "/api/hr/overtime-settlements"
            "/api/hr/payroll-tax-settings"
            "/api/hr/compensation"
            "/api/hr/timesheet"
            "/api/hr/timeclock"
          )
          for path in "${routes[@]}"; do
            code=$(curl -sS -X OPTIONS -o /tmp/api.txt -w '%{http_code}' "$PREVIEW_BASE$path" || true)
            echo "$path -> HTTP $code"
            case "$code" in
              2*) ;;
              *) cat /tmp/api.txt || true; exit 1 ;;
            esac
          done

      - name: Smoke test ZKTeco ADMS routes
        shell: bash
        run: |
          set -euo pipefail
          for path in "/iclock/cdata?SN=CI-UNKNOWN" "/iclock/cdata.aspx?SN=CI-UNKNOWN"; do
            code=$(curl -sS -o /tmp/adms.txt -w '%{http_code}' "$PREVIEW_BASE$path" || true)
            echo "$path -> HTTP $code"
            cat /tmp/adms.txt || true
            test "$code" = "200"
            grep -q "DEVICE NOT REGISTERED" /tmp/adms.txt
          done
          for path in "/iclock/getrequest?SN=CI-UNKNOWN" "/iclock/getrequest.aspx?SN=CI-UNKNOWN"; do
            code=$(curl -sS -o /tmp/adms.txt -w '%{http_code}' "$PREVIEW_BASE$path" || true)
            echo "$path -> HTTP $code"
            test "$code" = "200"
            grep -q "OK" /tmp/adms.txt
          done
          echo 'ZKTeco ADMS route smoke passed'

      - name: Diagnose HR Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          health_code=$(curl -sS -o /tmp/hr-health.json -w '%{http_code}' "$PREVIEW_BASE/api/hr/runtime-health" || true)
          echo "/api/hr/runtime-health -> HTTP $health_code"
          cat /tmp/hr-health.json || true
          echo

          options_code=$(curl -sS -X OPTIONS -o /tmp/hr-options.txt -w '%{http_code}' "$PREVIEW_BASE/api/hr/timesheet" || true)
          echo "/api/hr/timesheet OPTIONS -> HTTP $options_code"
          cat /tmp/hr-options.txt || true
          echo

          get_code=$(curl -sS -o /tmp/hr-timesheet.json -w '%{http_code}' "$PREVIEW_BASE/api/hr/timesheet?from=2026-10-01&to=2026-10-31" || true)
          echo "/api/hr/timesheet unauthenticated -> HTTP $get_code"
          cat /tmp/hr-timesheet.json || true
          echo

          test "$health_code" = "200"
          test "$options_code" = "204"
          test "$get_code" = "401"

      - name: Verify iiko state requires authentication
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/state.json -w '%{http_code}' "$PREVIEW_BASE/api/iiko/state" || true)
          echo "/api/iiko/state unauthenticated -> HTTP $code"
          cat /tmp/state.json || true
          test "$code" = "401"
