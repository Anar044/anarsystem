name: Make P&L revenue data-driven from transactions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P&L dynamic revenue fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update P&L revenue logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('functions/api/iiko/pnl.js')
          s = p.read_text(encoding='utf-8')

          # SALES is used only for category analytics, never for P&L discounts/surcharges.
          s = s.replace('// Discounts / surcharges: SALES OLAP', '// Revenue, discounts and surcharges: TRANSACTIONS OLAP by Account.Type')
          s = re.sub(r"    const discount=findField\(salesFields,\[[^\n]+\);\n", "", s, count=1)
          s = re.sub(r"    const surcharge=findField\(salesFields,\[[^\n]+\);\n", "", s, count=1)
          s = re.sub(r"    if\(!discount\)throw Error\([^\n]+\);\n", "", s, count=1)
          s = re.sub(r"    const categoryQuery=await olap\(u,t,'SALES',\{rows:\[category\],measures:\[salesBase,discount,\.\.\.\(surcharge\?\[surcharge\]:\[\]\)\],", "    const categoryQuery=await olap(u,t,'SALES',{rows:[category],measures:[salesBase],", s, count=1)
          s = re.sub(r"      discount:value\(r,discount\),\n      surcharge:surcharge\?value\(r,surcharge\):0,\n      value:value\(r,salesBase\)\+value\(r,discount\)-\(surcharge\?value\(r,surcharge\):0\)", "      value:value(r,salesBase)", s, count=1)
          s = re.sub(r"    const salesDiscount= sumField\(categoryQuery\.report,discount\);\n    const salesSurcharge=surcharge\?sumField\(categoryQuery\.report,surcharge\):0;\n    const discountLabel=fieldTitle\(salesFields,discount\);\n    const surchargeLabel=surcharge\?fieldTitle\(salesFields,surcharge\):'';\n    const categoryBase=sumField\(categoryQuery\.report,salesBase\);\n    const categoryRevenue=categoryBase\+salesDiscount-salesSurcharge;", "    const salesDiscount=0;\n    const salesSurcharge=0;\n    const categoryBase=sumField(categoryQuery.report,salesBase);\n    const categoryRevenue=categoryBase;", s, count=1)
          s = re.sub(r"        selectedSalesFields:\{salesBase,discount,surcharge,category,salesDate\},", "        selectedSalesFields:{salesBase,category,salesDate},", s, count=1)
          s = s.replace("// Discounts and surcharges come ONLY from SALES OLAP.", "// Revenue, discounts and surcharges come from TRANSACTIONS by Account.Type.")

          if 'const discount=' in s or 'const surcharge=' in s:
              raise SystemExit('SALES discount/surcharge fields were not fully removed')
          if 'measures:[salesBase,discount' in s:
              raise SystemExit('SALES query still requests discount')

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/iiko/pnl.js
          git commit -m 'Apply P&L dynamic revenue fix'
          git push
          rm -f .github/workflows/fix-pnl-dynamic-revenue.yml
          git add .github/workflows/fix-pnl-dynamic-revenue.yml
          git commit -m 'Remove temporary P&L dynamic revenue workflow'
          git push
