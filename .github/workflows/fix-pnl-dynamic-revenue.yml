name: Fix P&L revenue structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P&L revenue structure fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P&L revenue structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('functions/api/iiko/pnl.js')
          s = p.read_text(encoding='utf-8')

          # SALES is only for category analytics. P&L amounts come from TRANSACTIONS.
          s = re.sub(r"\n    const discount=findField\(salesFields,\[[^\n]*\);", "", s, count=1)
          s = re.sub(r"\n    const surcharge=findField\(salesFields,\[[^\n]*\);", "", s, count=1)
          s = re.sub(r"\n    if\(!discount\)throw Error\([^\n]*\);", "", s, count=1)
          s = re.sub(r"const categoryQuery=await olap\(u,t,'SALES',\{rows:\[category\],measures:\[salesBase,discount,\.\.\.\(surcharge\?\[surcharge\]:\[\]\)\],", "const categoryQuery=await olap(u,t,'SALES',{rows:[category],measures:[salesBase],", s, count=1)
          s = re.sub(r"      discount:value\(r,discount\),\n      surcharge:surcharge\?value\(r,surcharge\):0,\n      value:value\(r,salesBase\)\+value\(r,discount\)-\(surcharge\?value\(r,surcharge\):0\)", "      value:value(r,salesBase)", s, count=1)
          s = re.sub(r"\n    const salesDiscount=0;\n    const salesSurcharge=0;", "", s, count=1)

          # Revenue is exactly the sum of the visible revenue accounts from TRANSACTIONS.
          s = re.sub(
              r"    // IMPORTANT: Trading revenue comes from TRANSACTIONS by account type\.\n    // SALES is NOT used for this P&L line\.\n    // Revenue, discounts and surcharges come from TRANSACTIONS by Account\.Type\.\n    const tradingRevenue=accountRoleTotal\(revenueAccounts\);\n    const discountValue=salesDiscount;\n    const surchargeValue=salesSurcharge;\n    const otherTradingRevenue=0;\n    const revenue=tradingRevenue\+discountValue-surchargeValue;",
              "    // IMPORTANT: Revenue is the sum of TRANSACTIONS accounts classified by Account.Type.\n    // Account.Name is display-only and is never hard-coded.\n    const tradingRevenue=accountRoleTotal(revenueAccounts);\n    const revenue=tradingRevenue;",
              s, count=1)

          # Exact hierarchy: Выручка -> Торговая выручка -> iiko Account.Name rows -> totals.
          start = s.find("    const revenueRows=[")
          end = s.find("\n\n    const cogsRows=", start)
          if start == -1 or end == -1:
              raise SystemExit('Revenue rows block not found')
          new_block = """    const revenueRows=[
      {name:'Выручка',value:tradingRevenue,kind:'section',level:true,open:true},
      {name:'Торговая выручка',value:tradingRevenue,kind:'section',level:true,open:true},
      ...revenueAccounts.map(x=>({name:x.name,value:x.value,kind:'sub',accountId:x.accountId,accountType:x.accountType})),
      {name:'Итого Торговая выручка',value:tradingRevenue,kind:'total'},
      {name:'Итого Выручка',value:tradingRevenue,kind:'total'}
    ];"""
          s = s[:start] + new_block + s[end:]

          # Remove obsolete P&L variables/properties left from SALES-based discounts/surcharges.
          s = re.sub(r"\n    const discountLabel=fieldTitle\([^\n]*;", "", s, count=1)
          s = re.sub(r"\n    const surchargeLabel=surcharge\?fieldTitle\([^\n]*;", "", s, count=1)
          s = re.sub(r"\n      discount:discountValue,", "", s, count=1)
          s = re.sub(r"\n      surcharge:surchargeValue,", "", s, count=1)
          s = re.sub(r"\n        olapDiscount:discountValue,", "", s, count=1)
          s = re.sub(r"\n        olapSurcharge:surchargeValue,", "", s, count=1)
          s = s.replace("source:'TRANSACTIONS Account.Type + SALES OLAP discounts/surcharges'", "source:'TRANSACTIONS Account.Type'")
          s = s.replace("      sourceNote:'iiko Server · P&L блоки определяются по Account.Type; Account.Id используется для группировки; названия счетов только отображаются · Торговая выручка: TRANSACTIONS Account.Type · скидки/надбавки: SALES OLAP · без кассовых смен',", "      sourceNote:'iiko Server · P&L блоки определяются по Account.Type; Account.Id используется для группировки; Account.Name берётся напрямую из iiko · P&L выручка: TRANSACTIONS · без кассовых смен',")
          s = re.sub(r",discount:x\.discount,surcharge:x\.surcharge", "", s)

          # Ensure no hard-coded revenue account names or obsolete SALES P&L variables remain.
          forbidden = ["salesDiscount", "salesSurcharge", "discountLabel", "surchargeLabel", "name:'Предоставленные скидки'", "name:'Сумма надбавки'", "name:'Торговая выручка без учета скидок'"]
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'Forbidden stale token remains: {token}')
          if "...revenueAccounts.map" not in s:
              raise SystemExit('Revenue accounts are not rendered from iiko data')

          p.write_text(s, encoding='utf-8')
          PY
          node --check functions/api/iiko/pnl.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/iiko/pnl.js
          git commit -m 'Apply P&L revenue structure fix'
          git push
          rm -f .github/workflows/fix-pnl-dynamic-revenue.yml
          git add -A .github/workflows
          git commit -m 'Remove temporary P&L revenue workflow'
          git push
