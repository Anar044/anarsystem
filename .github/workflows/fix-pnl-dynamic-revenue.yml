name: Fix P&L revenue structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P&L final revenue structure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final P&L revenue structure
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('functions/api/iiko/pnl.js')
          s = p.read_text(encoding='utf-8')

          # 1) Remove every SALES-derived P&L discount/surcharge variable/property.
          lines = []
          for line in s.splitlines():
              if any(token in line for token in [
                  'const discount=findField(salesFields',
                  'const surcharge=findField(salesFields',
                  'if(!discount)throw Error',
                  'const salesDiscount=',
                  'const salesSurcharge=',
                  'const discountLabel=',
                  'const surchargeLabel=',
                  'discount:discountValue,',
                  'surcharge:surchargeValue,',
                  'olapDiscount:discountValue,',
                  'olapSurcharge:surchargeValue,'
              ]):
                  continue
              lines.append(line)
          s = '\n'.join(lines) + '\n'

          # 2) SALES category analytics uses only the base sales measure.
          s = s.replace(
              "const categoryQuery=await olap(u,t,'SALES',{rows:[category],measures:[salesBase,discount,...(surcharge?[surcharge]:[])],",
              "const categoryQuery=await olap(u,t,'SALES',{rows:[category],measures:[salesBase],"
          )
          s = s.replace(
              "      discount:value(r,discount),\n      surcharge:surcharge?value(r,surcharge):0,\n      value:value(r,salesBase)+value(r,discount)-(surcharge?value(r,surcharge):0)",
              "      value:value(r,salesBase)"
          )
          s = s.replace(
              ",discount:x.discount,surcharge:x.surcharge",
              ""
          )

          # 3) Revenue is exactly the sum of TRANSACTIONS accounts with Account.Type=Доходы.
          old_start = "    // IMPORTANT: Trading revenue comes from TRANSACTIONS by account type."
          calc_start = s.find(old_start)
          calc_end = s.find("\n\n    const cogs=", calc_start)
          if calc_start == -1 or calc_end == -1:
              raise SystemExit('Revenue calculation block not found')
          calc_new = """    // IMPORTANT: Revenue is the sum of TRANSACTIONS accounts classified by Account.Type.
    // Account.Id is used for grouping; Account.Name is display-only.
    const tradingRevenue=accountRoleTotal(revenueAccounts);
    const revenue=tradingRevenue;
"""
          s = s[:calc_start] + calc_new + s[calc_end+2:]

          # 4) Exact hierarchy requested by the user.
          rows_start = s.find("    const revenueRows=[")
          rows_end = s.find("\n\n    const cogsRows=", rows_start)
          if rows_start == -1 or rows_end == -1:
              raise SystemExit('Revenue rows block not found')
          rows_new = """    const revenueRows=[
      {name:'Выручка',value:tradingRevenue,kind:'section',level:true,open:true},
      {name:'Торговая выручка',value:tradingRevenue,kind:'section',level:true,open:true},
      ...revenueAccounts.map(x=>({name:x.name,value:x.value,kind:'sub',accountId:x.accountId,accountType:x.accountType})),
      {name:'Итого Торговая выручка',value:tradingRevenue,kind:'total'},
      {name:'Итого Выручка',value:tradingRevenue,kind:'total'}
    ];"""
          s = s[:rows_start] + rows_new + s[rows_end:]

          # 5) Update source description so it reflects the actual implementation.
          s = s.replace(
              "source:'TRANSACTIONS Account.Type + SALES OLAP discounts/surcharges'",
              "source:'TRANSACTIONS Account.Type'"
          )
          s = s.replace(
              "sourceNote:'iiko Server · P&L блоки определяются по Account.Type; Account.Id используется для группировки; названия счетов только отображаются · Торговая выручка: TRANSACTIONS Account.Type · скидки/надбавки: SALES OLAP · без кассовых смен',",
              "sourceNote:'iiko Server · P&L блоки определяются по Account.Type; Account.Id используется для группировки; Account.Name берётся напрямую из iiko · P&L выручка: TRANSACTIONS · без кассовых смен',"
          )

          # 6) Validate: no obsolete SALES P&L logic and no hard-coded account names.
          forbidden = [
              'salesDiscount', 'salesSurcharge', 'discountLabel', 'surchargeLabel',
              "name:'Предоставленные скидки'",
              "name:'Сумма надбавки'",
              "name:'Торговая выручка без учета скидок'",
              'discount:discountValue', 'surcharge:surchargeValue',
              'olapDiscount:discountValue', 'olapSurcharge:surchargeValue'
          ]
          for token in forbidden:
              if token in s:
                  raise SystemExit('Forbidden stale token: ' + token)
          if "...revenueAccounts.map(x=>({name:x.name" not in s:
              raise SystemExit('Revenue accounts are not rendered from iiko Account.Name')

          p.write_text(s, encoding='utf-8')
          PY
          node --check functions/api/iiko/pnl.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/iiko/pnl.js
          git commit -m 'Apply P&L final revenue structure'
          git push
          rm -f .github/workflows/fix-pnl-dynamic-revenue.yml
          git add -A .github/workflows
          git commit -m 'Remove temporary P&L revenue workflow'
          git push
