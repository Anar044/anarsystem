name: Fix order details enrichment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-order-details.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch plugin orders
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-orders.js
          git commit -m "Enrich order table with full order details"
          git rm .github/workflows/fix-order-details.yml
          git commit -m "Remove temporary order details workflow"
          git push
