name: Shift summary UI
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/workflows/patch_shift.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-control.html plugin-control.css
          git commit -m "Replace live event with shift revenue summary" || exit 0
          git rm .github/workflows/shift-summary.yml .github/workflows/patch_shift.py
          git commit -m "Remove temporary shift summary workflow"
          git push