name: Shift summary UI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/shift-summary.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-control.html plugin-control.css
          git commit -m "Replace live event with shift revenue summary"
          git rm .github/workflows/shift-summary.yml
          git commit -m "Remove temporary shift summary workflow"
          git push