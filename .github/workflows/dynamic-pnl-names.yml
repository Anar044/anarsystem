name: Apply dynamic P&L names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply dynamic P&L names'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make P&L account and field names dynamic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('functions/api/iiko/pnl.js')
          s=p.read_text(encoding='utf-8')

          old="function findField(fs,candidates){for(const c of candidates){const q=norm(c),x=fs.find(f=>norm(f.name)===q||norm(f.title)===q);if(x)return x.name}for(const c of candidates){const q=norm(c),x=fs.find(f=>norm(f.name).includes(q)||norm(f.title).includes(q));if(x)return x.name}return null}"
          new=old+"\nfunction fieldTitle(fs,name){const x=(fs||[]).find(f=>f.name===name);return x?clean(x.title||x.name||''):clean(name)}"
          if "function fieldTitle(fs,name)" not in s:
              if old not in s: raise SystemExit('findField target not found')
              s=s.replace(old,new,1)

          marker="    const salesSurcharge=surcharge?sumField(categoryQuery.report,surcharge):0;\n    const categoryBase=sumField(categoryQuery.report,salesBase);"
          replacement="    const salesSurcharge=surcharge?sumField(categoryQuery.report,surcharge):0;\n    const discountLabel=fieldTitle(salesFields,discount);\n    const surchargeLabel=surcharge?fieldTitle(salesFields,surcharge):'';\n    const categoryBase=sumField(categoryQuery.report,salesBase);"
          if marker in s:
              s=s.replace(marker,replacement,1)
          else:
              raise SystemExit('sales totals marker not found')

          start="    const revenueRows=[\n      {name:'Выручка',value:revenue,kind:'section',level:true,open:true},\n      {name:'Торговая выручка без учета скидок',value:tradingRevenue,kind:'sub'},\n      {name:'Предоставленные скидки',value:discountValue,kind:'sub'},\n      {name:'Сумма надбавки',value:-surchargeValue,kind:'sub'},\n      {name:'Торговая выручка, прочие',value:otherTradingRevenue,kind:'sub'},\n      {name:'Итого Торговая выручка',value:revenue,kind:'total'},\n      {name:'Итого Выручка',value:revenue,kind:'total'}\n    ];"
          target="    const revenueRows=[\n      {name:'Выручка',value:revenue,kind:'section',level:true,open:true},\n      ...revenueAccounts.map(x=>({name:x.name,value:x.value,kind:'sub'})),\n      ...(discountValue? [{name:discountLabel,value:discountValue,kind:'sub'}] : []),\n      ...(surchargeValue? [{name:surchargeLabel,value:-surchargeValue,kind:'sub'}] : []),\n      {name:'Итого Торговая выручка',value:revenue,kind:'total'},\n      {name:'Итого Выручка',value:revenue,kind:'total'}\n    ];"
          if start not in s: raise SystemExit('revenueRows target not found')
          s=s.replace(start,target,1)

          s=s.replace("    const otherTradingRevenue=0;\n", "    const otherTradingRevenue=0;\n")

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/iiko/pnl.js
          git commit -m 'Apply dynamic P&L names'
          git push
          rm -f .github/workflows/dynamic-pnl-names.yml
          git add -A .github/workflows
          git commit -m 'Remove temporary dynamic P&L names workflow'
          git push
