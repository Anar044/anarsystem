name: Remove temporary P&L test switch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove P&L test switch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove test switch and test endpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pnl.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<script src="pnl-test-source-switch.js?v=1"></script>', '')
          p.write_text(s, encoding='utf-8')
          Path('pnl-test-source-switch.js').unlink(missing_ok=True)
          Path('functions/api/iiko/pnl-test-sales-revenue.js').unlink(missing_ok=True)
          PY
          node --check functions/api/iiko/pnl.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove P&L test switch'
          git push
          rm -f .github/workflows/remove-pnl-test-switch.yml
          git add -A .github/workflows
          git commit -m 'Remove temporary cleanup workflow'
          git push
