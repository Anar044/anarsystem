name: Apply P&L label fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply P&L label fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename P&L row and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/api/iiko/pnl.js')
          s = p.read_text(encoding='utf-8')
          old = "{name:'Торговая выручка',value:tradingRevenue,kind:'sub'}"
          new = "{name:'Торговая выручка без учета скидок',value:tradingRevenue,kind:'sub'}"
          if old not in s:
              raise SystemExit('Target P&L row not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/api/iiko/pnl.js
          rm -f .github/workflows/apply-pnl-label-fix.yml .github/workflows/rename-pnl-trading-revenue.yml
          git add -A .github/workflows
          git commit -m 'Apply P&L label fix'
          git push
