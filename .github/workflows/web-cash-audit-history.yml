name: Web Cash Audit History
on:
  push:
    branches: [fix/web-cash-audit-timeline-20261019]
  pull_request:
    paths:
      - cash.js
      - tests/cash-audit-timeline.test.mjs
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cash.js
      - run: node --test tests/cash-audit-timeline.test.mjs
