name: Owner Mobile API Checks

on:
  push:
    branches:
      - 'feature/owner-mobile-*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --experimental-default-type=module --check functions/api/mobile/_lib/context.js
          node --experimental-default-type=module --check functions/api/mobile/v1/workspaces.js
          node --experimental-default-type=module --check functions/api/mobile/v1/bootstrap.js
          node --experimental-default-type=module --check functions/api/mobile/v1/summary.js
      - name: Test summary normalization
        run: node --experimental-default-type=module --test tests/mobile-summary.test.mjs
