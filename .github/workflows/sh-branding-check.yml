name: SH Branding Check

on:
  push:
  pull_request:

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify user-visible branding bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q "function applySHBranding" app-shell.js
          grep -q "MutationObserver" app-shell.js
          grep -q "replace(/iiko/gi,'SH')" app-shell.js
          echo "SH dynamic branding check passed"
