name: Apply P&L revenue test

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply P&L test source and remove temporary workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace trading revenue source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('functions/api/iiko/pnl.js')
          s = p.read_text(encoding='utf-8')
          old = "const tradingRevenue=accountRoleTotal(revenueAccounts);"
          new = "const tradingRevenue=categoryBase;"
          if old not in s:
              raise SystemExit('Target line not found; refusing to change anything.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/iiko/pnl.js
          git rm .github/workflows/apply-pnl-revenue-test.yml
          git commit -m "Apply P&L test source and remove temporary workflow"
          git push