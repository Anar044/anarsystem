<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Smart Horeca — Проверка iiko Broker</title>
  <style>
    :root {color-scheme:dark;font-family:system-ui,Segoe UI,Arial,sans-serif}
    body {background:#0d1624;color:#eef3fc;margin:0;padding:24px;min-height:100vh;box-sizing:border-box;display:grid;place-items:center}
    main {width:min(100%,560px);background:#182438;border:1px solid #35465c;border-radius:16px;padding:24px;box-sizing:border-box}
    h1 {font-size:22px;margin:0 0 10px}
    p {line-height:1.55;color:#c1cce0}
    #status {border:1px solid #465772;border-radius:10px;padding:14px;white-space:pre-wrap;line-height:1.5;background:#101e31}
    button,a {font:inherit}
    button {background:#356de6;color:#fff;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;margin:15px 0}
    button:disabled {opacity:.55;cursor:wait}
    a {color:#8fbbff}
    .muted {font-size:13px;color:#acb9c9}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/auth-config.js"></script>
  <script src="/auth.js"></script>
</head>
<body data-protected="true">
  <main>
    <h1>Проверка основного iiko Broker</h1>
    <p>Проверка соединения с Worker без запроса к iiko, авторизации /auth и расходования REST API лицензий.</p>
    <div id="status" role="status" aria-live="polite">Проверяем авторизацию…</div>
    <button id="check" type="button">Проверить ещё раз</button>
    <p class="muted">Показываются только безопасные параметры. Пароли, токены и адрес подключения не отображаются.</p>
    <p><a href="/index.html">Вернуться в Smart Horeca</a></p>
  </main>
  <script>
    (() => {
      "use strict";
      const status=document.getElementById("status");
      const button=document.getElementById("check");
      let started=false;
      async function run() {
        button.disabled=true;
        status.textContent="Проверяем основной брокер…";
        try {
          if(!window.SHAuth?.createClient) throw Error("Не загружена авторизация сайта.");
          const client=await window.SHAuth.createClient();
          const {data,error}=await client.auth.getSession();
          if(error) throw Error("Не удалось проверить авторизацию.");
          const token=data?.session?.access_token;
          if(!token) {
            status.textContent="Для диагностики нужен вход в Smart Horeca. Откройте страницу входа.";
            const login=new URL("/login.html",location.origin);
            login.searchParams.set("next","/broker-check.html");
            location.replace(login.pathname+login.search);
            return;
          }
          const response=await fetch("/api/iiko/broker-status",{
            method:"GET",cache:"no-store",credentials:"same-origin",
            headers:{"Authorization":"Bearer "+token,"Accept":"application/json"}
          });
          const data=await response.json().catch(()=>({code:"INVALID_RESPONSE"}));
          const allow=new Set(["BROKER_READY_NOT_SELECTED","BROKER_ACTIVE","NOT_CONFIGURED",
            "PRIVATE_IIKO_CONNECTION_REQUIRED","BROKER_UNREACHABLE","FORBIDDEN",
            "CONFIG_MISSING","ENCRYPTION_CONFIG_INVALID","TARGET_DENIED","BAD_REQUEST",
            "BROKER_NOT_READY","ACCESS_DENIED","UNAUTHENTICATED","WORKSPACE_REQUIRED",
            "BROKER_STATUS_UNAVAILABLE","DB_UNAVAILABLE","INVALID_RESPONSE"]);
          const code=allow.has(data?.code)?data.code:"UNKNOWN";
          const checks=[
            ["Связь с основным Worker",data?.workerReady===true?"Подтверждена":"Не подтверждена"],
            ["Service binding",data?.serviceBindingPresent===true?"Есть":"Не подтверждён"],
            ["Секрет сервиса",data?.serviceSecretPresent===true?"Есть":"Не подтверждён"],
            ["Организация включена",data?.workspaceSelected===true?"Да":"Нет"],
            ["Готовность конфигурации",data?.readyForActivation===true?"Да":"Нет"]
          ];
          status.textContent="HTTP "+response.status+" | "+code+"\n"+
            checks.map(([k,v])=>k+": "+v).join("\n");
        } catch {
          status.textContent="Не удалось проверить соединение. Код: BROKER_CHECK_NETWORK_ERROR";
        } finally {
          button.disabled=false;
        }
      }
      button.addEventListener("click",run);
      document.addEventListener("sh-auth-ready",()=>{if(!started){started=true;run()}});
      // The auth module emits sh-auth-ready after checking the logged-in user.
      // In authenticated browsing sessions this will occur automatically.
    })();
  </script>
</body>
</html>
