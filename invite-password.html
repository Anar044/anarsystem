<!doctype html>
<html lang="ru">
<head>
<script src="/auth-canonical-origin.js?v=20261010-v1"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Smart Horeca — Первый пароль</title>
<link rel="stylesheet" href="auth.css">
<style>
.invite-password-tip{margin:0 0 18px;font-size:13px;line-height:1.55;color:var(--muted,#99aab9)}
.invite-password-email{color:#42d392;font-weight:700;overflow-wrap:anywhere}
#invite-password-form{display:grid;gap:15px}
#invite-password-form .auth-field input{width:100%}
</style>
</head>
<body data-auth-page="invite-password">
<div class="auth-page">
  <div class="auth-wrap">
    <div class="auth-brand">Smart <span>Horeca</span></div>
    <div class="auth-card">
      <h1>Создайте пароль для входа</h1>
      <p class="lead">Ваш email подтверждён. Чтобы в следующий раз входить без новой ссылки, придумайте постоянный пароль.</p>
      <p class="invite-password-tip">Аккаунт: <span id="invite-password-email" class="invite-password-email"></span></p>
      <div id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></div>
      <form id="invite-password-form" novalidate>
        <div class="auth-field">
          <label for="invite-password">Придумайте пароль</label>
          <input id="invite-password" type="password" autocomplete="new-password" minlength="8" placeholder="Минимум 8 символов" required>
        </div>
        <div class="auth-field">
          <label for="invite-password-confirm">Повторите пароль</label>
          <input id="invite-password-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Повторите пароль" required>
        </div>
        <button class="auth-submit" type="submit">Сохранить пароль и продолжить</button>
      </form>
      <p class="invite-password-tip" style="margin-top:16px">Пароль будет сохранён в Supabase Auth. Администратор ресторана не видит ваш пароль.</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth-config.js"></script>
<script src="app-shell.js"></script>
<script src="/auth.js?v=20261010-invite-password-v2"></script>
</body>
</html>
