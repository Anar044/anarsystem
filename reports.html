<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SH_Reports — Отчёты</title>

    <link rel="stylesheet" href="app-shell.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="olap-ui.css">


    <style>

        /* ==========================================
           PAGE
        ========================================== */

        .reports-page {
            min-height: 80vh;
            padding: 120px 20px 60px;
        }


        .reports-container {
            max-width: 1100px;
            margin: 0 auto;
        }


        .reports-container > h1 {
            margin-bottom: 30px;
            color: #222 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           IIKO CARD
        ========================================== */

        .iiko-card {
            padding: 30px;
            border-radius: 16px;
            background: #ffffff;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            color: #222 !important;
            opacity: 1 !important;
        }


        .iiko-card h2 {
            margin-top: 0;
            margin-bottom: 25px;

            color: #222 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            color: #222 !important;
            opacity: 1 !important;
        }


        .form-group input {
            width: 100%;
            box-sizing: border-box;

            padding: 13px 15px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 16px;

            color: #222 !important;
            background: #fff !important;

            opacity: 1 !important;
        }


        .form-group input::placeholder {
            color: #888 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           REMEMBER LOGIN
        ========================================== */

        .remember-login {
            margin: 15px 0 20px;

            color: #222 !important;

            opacity: 1 !important;
        }


        .remember-login label {
            display: flex;

            align-items: center;

            gap: 8px;

            cursor: pointer;

            color: #222 !important;

            opacity: 1 !important;
        }


        .remember-login input {
            width: 18px;
            height: 18px;

            cursor: pointer;
        }


        /* ==========================================
           BUTTONS
        ========================================== */

        #connect-iiko,
        #load-sales {

            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: 600;
        }


        #connect-iiko:disabled,
        #load-sales:disabled {

            opacity: 0.6;

            cursor: wait;
        }


        /* ==========================================
           CLEAR BUTTON
        ========================================== */

        #clear-iiko-data {

            width: 100%;

            padding: 11px;

            border: 1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #555;

            cursor: pointer;

            font-size: 14px;
        }


        #clear-iiko-data:hover {

            background: #f5f5f5;
        }


        /* ==========================================
           STATUS
        ========================================== */

        .iiko-status {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #f5f5f5;

            text-align: center;

            color: #222 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           SALES CARD
        ========================================== */

        #sales-card {

            margin-top: 30px;

            color: #222 !important;

            opacity: 1 !important;
        }


        #sales-card h2,
        #sales-card h3 {

            color: #222 !important;

            opacity: 1 !important;
        }


        #sales-result {

            margin-top: 25px;

            color: #222 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           REPORT HEADER
        ========================================== */

        .report-header {

            margin-top: 30px;

            margin-bottom: 20px;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-header h2 {

            margin: 0 0 8px 0;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-period {

            color: #666 !important;

            font-size: 14px;

            opacity: 1 !important;
        }


        /* ==========================================
           REPORT CARDS
        ========================================== */

        .report-cards {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }


        .report-card {

            padding: 20px;

            border-radius: 12px;

            background: #f7f7f7;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-card-title {

            font-size: 14px;

            color: #666 !important;

            margin-bottom: 10px;

            opacity: 1 !important;
        }


        .report-card-value {

            font-size: 24px;

            font-weight: 700;

            color: #111 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           TABLE
        ========================================== */

        .report-table-wrapper {

            margin-top: 20px;

            overflow-x: auto;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table-wrapper h3 {

            margin-bottom: 15px;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table {

            width: 100%;

            border-collapse: collapse;

            background: #fff;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table th,
        .report-table td {

            padding: 12px;

            border-bottom:
                1px solid #e5e5e5;

            text-align: left;

            color: #222 !important;

            opacity: 1 !important;

            white-space: nowrap;
        }


        .report-table th {

            font-weight: 600;

            background: #f3f3f3;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table td {

            background: #fff;

            color: #222 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           EMPTY
        ========================================== */

        .empty-report {

            text-align: center !important;

            padding: 30px !important;

            color: #666 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           LOADING
        ========================================== */

        .report-loading {

            padding: 20px;

            text-align: center;

            color: #444 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           ERROR
        ========================================== */

        .report-error {

            padding: 15px;

            border-radius: 8px;

            background: #fff0f0;

            color: #c00000 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           FORCE TEXT VISIBILITY
        ========================================== */

        #sales-card *,
        #sales-result *,
        .report-card *,
        .report-table * {

            opacity: 1 !important;
        }


        /* ==========================================
           OLAP BUILDER
        ========================================== */

        #olap-builder {

            margin-top: 30px;

            padding: 30px;

            border-radius: 16px;

            background: #ffffff;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);

            color: #222 !important;

            opacity: 1 !important;
        }


        #olap-builder * {

            opacity: 1 !important;
        }


        .olap-builder h2 {

            margin-top: 0;

            margin-bottom: 8px;

            color: #222 !important;
        }


        .olap-description {

            margin-bottom: 25px;

            color: #666 !important;

            line-height: 1.5;
        }


        /* ==========================================
           OLAP TOOLBAR
        ========================================== */

        .olap-toolbar {

            display: flex;

            align-items: end;

            gap: 15px;

            flex-wrap: wrap;

            margin-bottom: 15px;
        }


        .olap-toolbar label {

            flex: 1;

            min-width: 220px;

            color: #222 !important;

            font-weight: 600;
        }


        .olap-toolbar select {

            width: 100%;

            box-sizing: border-box;

            margin-top: 7px;

            padding: 12px 14px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #222;

            font-size: 15px;
        }


        .olap-toolbar button {

            padding: 12px 18px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #222;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;
        }


        .olap-toolbar button:hover {

            background: #f5f5f5;
        }


        /* ==========================================
           OLAP STATUS
        ========================================== */

        .olap-status {

            margin:
                15px 0 20px;

            padding: 12px 15px;

            border-radius: 8px;

            background: #f5f5f5;

            color: #333 !important;
        }


        /* ==========================================
           OLAP GRID
        ========================================== */

        .olap-grid {

            display: grid;

            grid-template-columns:
                minmax(300px, 1fr)
                minmax(300px, 1fr);

            gap: 20px;
        }


        .olap-panel {

            padding: 20px;

            border:
                1px solid #e5e5e5;

            border-radius: 12px;

            background: #fafafa;
        }


        .olap-panel h3 {

            margin:
                0 0 12px;

            color: #222 !important;

            font-size: 17px;
        }


        /* ==========================================
           SEARCH
        ========================================== */

        #olap-search {

            width: 100%;

            box-sizing: border-box;

            padding: 12px 14px;

            margin-bottom: 12px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #222;

            font-size: 15px;
        }


        #olap-search::placeholder {

            color: #888;
        }


        /* ==========================================
           AVAILABLE FIELDS
        ========================================== */

        .olap-fields {

            display: flex;

            flex-direction: column;

            gap: 7px;

            max-height: 480px;

            overflow-y: auto;

            padding-right: 3px;
        }


        .olap-field {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;

            padding: 11px 12px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #222;

            text-align: left;

            cursor: pointer;

            transition:
                background 0.15s,
                border-color 0.15s;
        }


        .olap-field:hover {

            background: #f0f0f0;

            border-color: #bbb;
        }


        .olap-field > span:first-child {

            display: flex;

            flex-direction: column;

            gap: 3px;

            min-width: 0;
        }


        .olap-field strong {

            color: #222 !important;

            font-size: 14px;

            font-weight: 600;
        }


        .olap-field small {

            color: #888 !important;

            font-size: 11px;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space: nowrap;
        }


        .olap-flags {

            flex-shrink: 0;

            color: #777 !important;

            font-size: 12px;

            font-weight: 700;
        }


        /* ==========================================
           SELECTED FIELDS
        ========================================== */

        .olap-selected {

            min-height: 55px;

            margin-bottom: 25px;
        }


        .olap-selected-field {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 10px;

            padding: 10px 12px;

            margin-bottom: 7px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #222 !important;
        }


        .olap-selected-field > span {

            display: flex;

            flex-direction: column;

            gap: 3px;

            min-width: 0;

            color: #222 !important;
        }


        .olap-selected-field small {

            color: #888 !important;

            font-size: 11px;
        }


        .olap-selected-field button {

            flex-shrink: 0;

            width: 28px;

            height: 28px;

            border: 0;

            border-radius: 6px;

            background: #f2f2f2;

            color: #666;

            cursor: pointer;

            font-size: 19px;

            line-height: 1;
        }


        .olap-selected-field button:hover {

            background: #e5e5e5;

            color: #222;
        }


        /* ==========================================
           EMPTY OLAP
        ========================================== */

        .olap-empty {

            padding: 15px;

            border-radius: 8px;

            background: #fff;

            color: #888 !important;

            text-align: center;
        }


        /* ==========================================
           PERIOD
        ========================================== */

        .olap-period {

            margin-top: 20px;

            padding: 20px;

            border:
                1px solid #e5e5e5;

            border-radius: 12px;

            background: #fafafa;
        }


        .olap-period h3 {

            margin:
                0 0 15px;

            color: #222 !important;
        }


        .olap-period > div {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }


        .olap-period label {

            display: flex;

            flex-direction: column;

            color: #222 !important;

            font-weight: 600;
        }


        .olap-period input {

            width: 100%;

            box-sizing: border-box;

            margin-top: 7px;

            padding: 12px 14px;

            border:
                1px solid #ddd;

            border-radius: 8px;

            background: #fff;

            color: #222;

            font-size: 15px;
        }


        /* ==========================================
           RUN OLAP
        ========================================== */

        #olap-run {

            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: 0;

            border-radius: 8px;

            background: #222;

            color: #fff;

            cursor: pointer;

            font-size: 16px;

            font-weight: 700;
        }


        #olap-run:hover {

            background: #333;
        }


        #olap-run:disabled {

            opacity: 0.6 !important;

            cursor: wait;
        }


        /* ==========================================
           OLAP RESULT
        ========================================== */

        .olap-result {

            margin-top: 25px;

            color: #222 !important;
        }


        .olap-result .report-header {

            margin-top: 0;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            .reports-page {

                padding:
                    100px 15px 40px;
            }


            .reports-container {

                max-width: 100%;
            }


            .iiko-card {

                padding: 20px;
            }


            .report-cards {

                grid-template-columns:
                    1fr;
            }


            .report-table {

                font-size: 14px;
            }


            .report-table th,
            .report-table td {

                padding:
                    9px 7px;
            }


            .olap-grid {

                grid-template-columns:
                    1fr;
            }


            .olap-period > div {

                grid-template-columns:
                    1fr;
            }


            .olap-toolbar {

                flex-direction: column;

                align-items: stretch;
            }


            .olap-toolbar label {

                min-width: 100%;
            }


            .olap-toolbar button {

                width: 100%;
            }


            #olap-builder {

                padding: 20px;
            }

        }

    </style>

</head>


<body>
<div class="app-shell">
<aside class="sidebar">
 <div class="brand">SH_<span>Reports</span></div>
 <div class="nav-section">Аналитика</div>
 <nav class="side-nav">
  <a href="index.html"><span class="side-icon">◉</span>Обзор</a>
  <a class="active" href="reports.html"><span class="side-icon">▥</span>OLAP Отчёты</a>
  <a href="reports.html#constructor"><span class="side-icon">⌘</span>Конструктор</a>
  <a href="settings.html"><span class="side-icon">⚙</span>Настройки</a>
 </nav>
 <div class="sidebar-spacer"></div>
 <button class="theme-btn" onclick="toggleSHTheme()" data-theme-label>🌙 Тёмная тема</button>
</aside>
<main class="main">
<header class="topbar"><div><button class="icon-btn mobile-menu" data-mobile-menu>☰</button><span class="topbar-title">Отчёты</span><div class="topbar-sub">Конструктор аналитических отчётов</div></div><div class="top-actions"><a class="period-chip" href="index.html">← Обзор</a></div></header>
<div class="app-content">


    <!-- ==========================================
         NAVIGATION
    ========================================== -->

    <script src="nav.js"></script>


    <!-- ==========================================
         PAGE
    ========================================== -->

    <main class="reports-page">

        <div class="reports-container">


            <h1>
                OLAP Отчёты
            </h1>



            <!-- ======================================
                 SALES
            ======================================= -->

            <div
                class="iiko-card"
                id="sales-card"
                style="display:none;"
            >


                <h2>
                    📊 Продажи
                </h2>


                <div class="form-group">

                    <label for="report-from">
                        Дата от
                    </label>

                    <input
                        id="report-from"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="report-to">
                        Дата до
                    </label>

                    <input
                        id="report-to"
                        type="date"
                    >

                </div>


                <button id="load-sales">
                    Получить отчёт
                </button>


                <div id="sales-result"></div>


            </div>


            <!--
                OLAP КОНСТРУКТОР СОЗДАЁТСЯ
                АВТОМАТИЧЕСКИ ИЗ reports.js
            -->


        </div>

    </main>


    <!-- ==========================================
         REPORTS JS
    ========================================== -->

    <script src="reports.js"></script>


</div></main></div><script src="app-shell.js"></script>
</body>

</html>
