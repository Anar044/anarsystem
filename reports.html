<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>HorecaControl — OLAP Отчёты</title>
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="reports-fields-scroll.css?v=20260910-4">
<link rel="stylesheet" href="reports-header-compact.css?v=20260910-1">
<link rel="stylesheet" href="reports-result.css?v=20260909-5">
<style>
/* OLAP fields: keep the long 258-field list inside the left card. */
#olap-builder .olap-workspace{align-items:start!important;}
#olap-builder .olap-fields-card{align-self:start!important;height:700px!important;min-height:700px!important;max-height:700px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;}
#olap-builder .olap-fields-card .olap-card-title,#olap-builder .olap-fields-card .olap-search-wrap,#olap-builder .olap-fields-card .olap-field-actions{flex:0 0 auto!important;}
#olap-builder #olap-fields{flex:1 1 auto!important;height:auto!important;min-height:0!important;max-height:none!important;overflow-y:scroll!important;overflow-x:hidden!important;overscroll-behavior:contain!important;scrollbar-gutter:stable!important;padding-right:8px!important;}
#olap-builder #olap-fields::-webkit-scrollbar{width:12px!important;}
#olap-builder #olap-fields::-webkit-scrollbar-track{background:#0d1722!important;border-radius:8px!important;}
#olap-builder #olap-fields::-webkit-scrollbar-thumb{background:#536b80!important;border:2px solid #0d1722!important;border-radius:8px!important;}
#olap-builder #olap-fields::-webkit-scrollbar-thumb:hover{background:#7591a8!important;}
@media(max-width:900px){#olap-builder .olap-fields-card{height:560px!important;min-height:560px!important;max-height:560px!important;}}
</style>
</head>
<body data-protected="true" style="background:#0b1017">
<div class="app-shell">
<aside class="sidebar">
  <div class="brand">HorecaControl<span>Restaurant Management</span></div>
  <div class="nav-section">Основное</div>
  <nav class="side-nav">

    <a href="settings.html"><span class="side-icon">⚙</span>Настройки</a>
  </nav>
  <div class="sidebar-spacer"></div>
  <button class="theme-btn" onclick="toggleSHTheme()" data-theme-label>🌙 Тёмная тема</button>
</aside>
<main class="main">
<header class="topbar">
  <div><button class="icon-btn mobile-menu" data-mobile-menu>☰</button><span class="topbar-title">Отчёты</span><div class="topbar-sub">Конструктор аналитических отчётов</div></div>
</header>
<div class="app-content">
  <main class="reports-page">
    <div class="reports-container">
      <h1>OLAP Отчёты</h1>
      <div class="iiko-card" id="sales-card" style="display:none;">
        <h2>📊 Продажи</h2>
        <div class="form-group"><label for="report-from">Дата от</label><input id="report-from" type="date"></div>
        <div class="form-group"><label for="report-to">Дата до</label><input id="report-to" type="date"></div>
        <button id="load-sales">Получить отчёт</button>
        <div id="sales-result"></div>
      </div>
    </div>
  </main>
</div>
</main>
</div>
