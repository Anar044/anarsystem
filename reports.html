<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Отчёты — Anar System</title>

    <link rel="stylesheet" href="pages.css">


    <style>

        /* ==========================================
           PAGE
        ========================================== */

        .reports-page {
            min-height: 80vh;
            padding: 120px 20px 60px;
        }


        .reports-container {
            max-width: 900px;
            margin: 0 auto;
        }


        .reports-container > h1 {
            margin-bottom: 30px;
            color: #222 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           IIKO CARD
        ========================================== */

        .iiko-card {
            padding: 30px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.08);

            color: #222 !important;
            opacity: 1 !important;
        }


        .iiko-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            color: #222 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           FORM
        ========================================== */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;
            margin-bottom: 7px;

            font-weight: 600;

            color: #222 !important;
            opacity: 1 !important;
        }


        .form-group input {
            width: 100%;
            box-sizing: border-box;

            padding: 13px 15px;

            border: 1px solid #ddd;
            border-radius: 8px;

            font-size: 16px;

            color: #222 !important;
            background: #fff !important;

            opacity: 1 !important;
        }


        .form-group input::placeholder {
            color: #888 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           BUTTONS
        ========================================== */

        #connect-iiko,
        #load-sales {

            width: 100%;

            padding: 14px;

            border: 0;
            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
            font-weight: 600;
        }


        #connect-iiko:disabled,
        #load-sales:disabled {
            opacity: 0.6;
            cursor: wait;
        }


        /* ==========================================
           STATUS
        ========================================== */

        .iiko-status {

            margin-top: 20px;

            padding: 12px;

            border-radius: 8px;

            background: #f5f5f5;

            text-align: center;

            color: #222 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           SALES CARD
        ========================================== */

        #sales-card {
            margin-top: 30px;

            color: #222 !important;
            opacity: 1 !important;
        }


        #sales-card h2,
        #sales-card h3 {
            color: #222 !important;
            opacity: 1 !important;
        }


        #sales-result {
            margin-top: 25px;

            color: #222 !important;
            opacity: 1 !important;
        }


        /* ==========================================
           REPORT HEADER
        ========================================== */

        .report-header {

            margin-top: 30px;
            margin-bottom: 20px;

            color: #222 !important;
            opacity: 1 !important;
        }


        .report-header h2 {

            margin: 0 0 8px 0;

            color: #222 !important;
            opacity: 1 !important;
        }


        .report-period {

            color: #666 !important;

            font-size: 14px;

            opacity: 1 !important;
        }


        /* ==========================================
           REPORT CARDS
        ========================================== */

        .report-cards {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }


        .report-card {

            padding: 20px;

            border-radius: 12px;

            background: #f7f7f7;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-card-title {

            font-size: 14px;

            color: #666 !important;

            margin-bottom: 10px;

            opacity: 1 !important;
        }


        .report-card-value {

            font-size: 24px;

            font-weight: 700;

            color: #111 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           TABLE
        ========================================== */

        .report-table-wrapper {

            margin-top: 20px;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table-wrapper h3 {

            margin-bottom: 15px;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table {

            width: 100%;

            border-collapse: collapse;

            background: #fff;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table th,
        .report-table td {

            padding: 12px;

            border-bottom:
                1px solid #e5e5e5;

            text-align: left;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table th {

            font-weight: 600;

            background: #f3f3f3;

            color: #222 !important;

            opacity: 1 !important;
        }


        .report-table td {

            background: #fff;

            color: #222 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           EMPTY
        ========================================== */

        .empty-report {

            text-align: center !important;

            padding: 30px !important;

            color: #666 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           LOADING
        ========================================== */

        .report-loading {

            padding: 20px;

            text-align: center;

            color: #444 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           ERROR
        ========================================== */

        .report-error {

            padding: 15px;

            border-radius: 8px;

            background: #fff0f0;

            color: #c00000 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           FORCE TEXT VISIBILITY
        ========================================== */

        #sales-card *,
        #sales-result *,
        .report-card *,
        .report-table * {

            opacity: 1 !important;
        }


        #sales-card strong {

            color: #222 !important;

            opacity: 1 !important;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 700px) {

            .reports-page {
                padding: 100px 15px 40px;
            }


            .iiko-card {
                padding: 20px;
            }


            .report-cards {

                grid-template-columns:
                    1fr;
            }


            .report-table {

                font-size: 14px;
            }


            .report-table th,
            .report-table td {

                padding: 9px 7px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVIGATION -->

    <script src="nav.js"></script>


    <main class="reports-page">


        <div class="reports-container">


            <h1>
                Отчёты
            </h1>


            <!-- ======================================
                 IIKO CONNECTION
            ======================================= -->

            <div class="iiko-card">


                <h2>
                    Подключение iiko Server
                </h2>


                <div class="form-group">

                    <label for="iiko-ip">
                        IP адрес / домен
                    </label>

                    <input
                        id="iiko-ip"
                        type="text"
                        placeholder="s01.smarthoreca.az"
                    >

                </div>


                <div class="form-group">

                    <label for="iiko-port">
                        Порт
                    </label>

                    <input
                        id="iiko-port"
                        type="number"
                        placeholder="Введите порт"
                    >

                </div>


                <div class="form-group">

                    <label for="iiko-login">
                        Логин
                    </label>

                    <input
                        id="iiko-login"
                        type="text"
                        autocomplete="username"
                        placeholder="Логин"
                    >

                </div>


                <div class="form-group">

                    <label for="iiko-password">
                        Пароль
                    </label>

                    <input
                        id="iiko-password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Пароль"
                    >

                </div>


                <button id="connect-iiko">
                    Подключиться
                </button>


                <div
                    id="iiko-status"
                    class="iiko-status"
                >
                    ⚪ Не подключено
                </div>


            </div>


            <!-- ======================================
                 SALES
            ======================================= -->

            <div
                class="iiko-card"
                id="sales-card"
                style="display:none;"
            >


                <h2>
                    📊 Продажи
                </h2>


                <div class="form-group">

                    <label for="report-from">
                        Дата от
                    </label>

                    <input
                        id="report-from"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label for="report-to">
                        Дата до
                    </label>

                    <input
                        id="report-to"
                        type="date"
                    >

                </div>


                <button id="load-sales">
                    Получить отчёт
                </button>


                <div id="sales-result"></div>


            </div>


        </div>


    </main>


    <script src="reports.js"></script>


</body>

</html>
