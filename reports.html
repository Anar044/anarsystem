<!DOCTYPE html>
<html lang="ru" data-theme="dark" style="background:#0b1017;visibility:hidden">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HorecaControl — OLAP Отчёты</title>
<link rel="stylesheet" href="app-shell.css">
<link rel="stylesheet" href="reports-fields-scroll.css?v=20260910-5">
<link rel="stylesheet" href="reports-result.css?v=20260909-5">
<style>
#olap-builder{margin-top:-20px!important;}
#olap-builder .olap-workspace{align-items:start!important;}
#olap-builder .olap-fields-card{align-self:start!important;height:700px!important;min-height:700px!important;max-height:700px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important;}
#olap-builder .olap-fields-card .olap-card-title,#olap-builder .olap-fields-card .olap-search-wrap,#olap-builder .olap-fields-card .olap-field-actions{flex:0 0 auto!important;}
#olap-builder #olap-fields{flex:1 1 auto!important;height:auto!important;min-height:0!important;max-height:none!important;overflow-y:scroll!important;overflow-x:hidden!important;overscroll-behavior:contain!important;scrollbar-gutter:stable!important;padding-right:8px!important;}
#olap-builder #olap-fields::-webkit-scrollbar{width:12px!important;}
#olap-builder #olap-fields::-webkit-scrollbar-track{background:#0d1722!important;border-radius:8px!important;}
#olap-builder #olap-fields::-webkit-scrollbar-thumb{background:#536b80!important;border:2px solid #0d1722!important;border-radius:8px!important;}
#olap-builder #olap-fields::-webkit-scrollbar-thumb:hover{background:#7591a8!important;}

/* Smooth bootstrap while D1/iiko state is being restored. */
#reports-loading{display:flex;align-items:center;justify-content:center;min-height:560px;padding:32px;box-sizing:border-box;}
#reports-loading .reports-loading-card{width:min(520px,100%);padding:34px 36px;border:1px solid rgba(148,163,184,.16);border-radius:20px;background:linear-gradient(145deg,rgba(20,29,40,.96),rgba(13,20,29,.96));box-shadow:0 20px 60px rgba(0,0,0,.28);text-align:center;}
#reports-loading .reports-loading-spinner{width:38px;height:38px;margin:0 auto 18px;border:3px solid rgba(148,163,184,.18);border-top-color:#8aa7c2;border-radius:50%;animation:reports-loading-spin .8s linear infinite;}
#reports-loading .reports-loading-title{font-size:18px;font-weight:700;color:#eef4f8;margin-bottom:8px;}
#reports-loading .reports-loading-text{font-size:13px;line-height:1.5;color:#8fa0b2;}
@keyframes reports-loading-spin{to{transform:rotate(360deg)}}

@media(max-width:900px){#olap-builder{margin-top:-12px!important;}#olap-builder .olap-fields-card{height:560px!important;min-height:560px!important;max-height:560px!important;}#reports-loading{min-height:460px;padding:24px 12px;}#reports-loading .reports-loading-card{padding:28px 22px;}}
</style>
</head>
<body data-protected="true" style="background:#0b1017">
<div class="app-shell">
<aside class="sidebar">
  <div class="brand">HorecaControl<span>Restaurant Management</span></div>
  <div class="nav-section">Основное</div>
  <nav class="side-nav">
    <a href="index.html"><span class="side-icon">⌂</span>Dashboard</a>
    <a href="reports.html"><span class="side-icon">▥</span>OLAP Отчёты</a>
    <a href="plugin-control.html"><span class="side-icon">▣</span>Кассы</a>
    <a href="qr-menu.html"><span class="side-icon">▦</span>QR Menu</a>
    <a href="settings.html"><span class="side-icon">⚙</span>Настройки</a>
  </nav>
  <div class="sidebar-spacer"></div>
  <button class="theme-btn" onclick="toggleSHTheme()" data-theme-label>🌙 Тёмная тема</button>
</aside>
<main class="main">
<header class="topbar">
  <div><button class="icon-btn mobile-menu" data-mobile-menu>☰</button><span class="topbar-title">Отчёты</span><div class="topbar-sub">Конструктор аналитических отчётов</div></div>
</header>
<div class="app-content">
  <main class="reports-page">
    <div class="reports-container">
      <div id="reports-loading" aria-live="polite">
        <div class="reports-loading-card">
          <div class="reports-loading-spinner" aria-hidden="true"></div>
          <div class="reports-loading-title">Загружаем OLAP отчёты</div>
          <div class="reports-loading-text">Восстанавливаем подключение к iiko и подготавливаем доступные поля…</div>
        </div>
      </div>
      <div class="iiko-card" id="sales-card" style="display:none;">
        <h2>📊 Продажи</h2>
        <div class="form-group"><label for="report-from">Дата от</label><input id="report-from" type="date"></div>
        <div class="form-group"><label for="report-to">Дата до</label><input id="report-to" type="date"></div>
        <button id="load-sales">Получить отчёт</button>
        <div id="sales-result"></div>
      </div>
    </div>
  </main>
</div>
</main>
</div>

<script src="reports-result.js?v=20260910-6"></script>
<script src="documents-nav.js?v=3"></script>
</body>
</html>
