<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SH_Reports — OLAP Отчёты</title>

    <link rel="stylesheet" href="app-shell.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="olap-ui.css">
</head>

<body>
<div class="app-shell">

    <aside class="sidebar">
        <div class="brand">SH_<span>Reports</span></div>

        <div class="nav-section">Аналитика</div>
        <nav class="side-nav">
            <a href="index.html">
                <span class="side-icon">◉</span>
                Обзор
            </a>
            <a class="active" href="reports.html">
                <span class="side-icon">▥</span>
                OLAP Отчёты
            </a>
            <a href="settings.html">
                <span class="side-icon">⚙</span>
                Настройки
            </a>
        </nav>

        <div class="sidebar-spacer"></div>

        <button
            class="theme-btn"
            type="button"
            onclick="toggleSHTheme()"
            data-theme-label
        >🌙 Тёмная тема</button>
    </aside>

    <main class="main">

        <header class="topbar">
            <div class="topbar-left">
                <button
                    class="icon-btn mobile-menu"
                    type="button"
                    data-mobile-menu
                    aria-label="Меню"
                >☰</button>

                <div>
                    <div class="topbar-title">OLAP Отчёты</div>
                    <div class="topbar-sub">Конструктор аналитических отчётов</div>
                </div>
            </div>
        </header>

        <div class="app-content">
            <main class="reports-page">
                <div class="reports-container">

                    <!--
                        Этот блок нужен reports.js только как контейнер.
                        Сам OLAP-конструктор создаётся JavaScript-ом.
                    -->

                    <div
                        class="iiko-card"
                        id="sales-card"
                        style="display:none;"
                    >
                        <h2>📊 Продажи</h2>

                        <div class="form-group">
                            <label for="report-from">Дата от</label>
                            <input id="report-from" type="date">
                        </div>

                        <div class="form-group">
                            <label for="report-to">Дата до</label>
                            <input id="report-to" type="date">
                        </div>

                        <button id="load-sales" type="button">
                            Получить отчёт
                        </button>

                        <div id="sales-result"></div>
                    </div>

                </div>
            </main>
        </div>
    </main>
</div>

<script src="reports.js"></script>
<script src="app-shell.js"></script>
</body>
</html>
